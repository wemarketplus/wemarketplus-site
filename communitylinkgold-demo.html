<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#07111e;color:#f4f8ff}
.layout{display:flex;height:100vh;overflow:hidden}
.sb{width:224px;min-width:224px;background:#060e1b;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sb-top{padding:14px 12px 10px;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sb-icon{width:30px;height:30px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-title{font-size:13px;font-weight:900;color:#f4f8ff}
.sb-tier{font-size:9px;color:#f59e0b;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.demo-badge{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:6px 10px;font-size:11px;color:#f59e0b;font-weight:700;text-align:center;margin-bottom:8px}
.role-box{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.12);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.role-lbl{font-size:9px;font-weight:800;color:#4b6278;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.role-sel{width:100%;background:#0a1628;border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;color:#f0f5ff;outline:none;cursor:pointer;font-family:inherit}
.role-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10px;font-weight:800;margin-top:5px;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.sb-nav{flex:1;overflow-y:auto;padding:0 8px 8px}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
.nav-sec{display:block;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#1e3a5f;padding:10px 6px 3px}
.nb{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:#7a9abf;background:transparent;border:none;font-family:inherit;transition:background .1s,color .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb:hover{background:rgba(255,255,255,.06);color:#c8d6e8}
.nb.on{background:rgba(245,158,11,.12);color:#f59e0b;font-weight:800}
.sb-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;font-size:10px;color:#2c4460;text-align:center}
.sb-foot a{color:#f59e0b;text-decoration:none}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:#060e1b;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.page-title{font-size:15px;font-weight:800;color:#f4f8ff}
.page-sub{font-size:11px;color:#4b6278}
.tb-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#06080e;border:none;border-radius:999px;padding:7px 18px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.content{flex:1;overflow-y:auto;padding:20px}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
.card{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:14px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-t{font-size:13px;font-weight:800;color:#f4f8ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:rgba(245,158,11,.3)}
.sl{font-size:10px;font-weight:700;color:#4b6278;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sv{font-size:26px;font-weight:900;color:#f4f8ff}
.ss{font-size:10px;color:#6b7fa3;margin-top:3px}
.sg{color:#4fc87a}.sr{color:#f87171}.sa{color:#f59e0b}
.fi{background:#0d1f38;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 11px;font-size:13px;color:#f4f8ff;font-family:inherit;outline:none;width:100%}
.fi:focus{border-color:#f59e0b}
select.fi{cursor:pointer}
textarea.fi{resize:vertical;min-height:72px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fl{display:flex;flex-direction:column;gap:4px}
.flb{font-size:11px;font-weight:700;color:#4b6278}
.fw{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;font-size:10px;font-weight:800;color:#1e3a5f;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.05)}
.tbl td{padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:#c8d6e8;vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.bg{background:rgba(79,200,122,.1);color:#4fc87a}
.ba{background:rgba(245,158,11,.1);color:#f59e0b}
.bb{background:rgba(61,158,232,.1);color:#3d9ee8}
.br{background:rgba(248,113,113,.1);color:#f87171}
.bx{background:rgba(255,255,255,.07);color:#8ba4c4}
.btn{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn-a{background:linear-gradient(135deg,#f59e0b,#d97706);color:#06080e}
.btn-g{background:linear-gradient(135deg,#4fc87a,#22a855);color:#06080e}
.btn-r{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:#f87171}
.btn-x{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#8ba4c4}
.btn-sm{padding:5px 11px;font-size:11px}
.pbar{height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:6px 0}
.pbar-f{height:100%;background:#f59e0b;border-radius:99px;transition:width .4s}
#toast{position:fixed;bottom:20px;right:20px;background:#0d1b31;border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;color:#f4f8ff;z-index:99999;opacity:0;transform:translateY(8px);transition:all .22s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.err{border-color:rgba(248,113,113,.4);background:#1a0d0d}
.gps-dot{width:14px;height:14px;background:#f59e0b;border-radius:50%;box-shadow:0 0 0 4px rgba(245,158,11,.25);animation:glow 1.5s infinite;margin:0 auto 10px}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(245,158,11,.25)}50%{box-shadow:0 0 0 12px rgba(245,158,11,.04)}}
</style>
</head>

function buildNav(){
  var nav=document.getElementById('sideNav');
  nav.innerHTML='';
  (NAV[ROLE]||NAV.admin).forEach(function(grp){
    nav.innerHTML+='<span class="nav-sec">'+grp.sec+'</span>';
    grp.items.forEach(function(item){
      nav.innerHTML+='<button class="nb'+(ACTIVE===item.k?' on':'')+'" onclick="go(\''+item.k+'\')">'+item.l+'</button>';
    });
  });
}
function go(key){
  ACTIVE=key;buildNav();
  var titles={dashboard:'Dashboard',occupancy:'Occupancy Overview',leads:'Lead Pipeline',tours:'Tour Scheduler',refs:'Referral Sources',apartments:'Apartment Inventory',makeready:'Make-Ready Board',maintenance:'Maintenance Tickets',housekeeping:'Housekeeping Tasks',tasks:'Tasks',reports:'Reports Center',settings:'Settings'};
  document.getElementById('pageTitle').textContent=titles[key]||key;
  render(key);
}
function changeRole(role){
  ROLE=role;
  var labels={director:'Executive Director',admin:'Administrator',marketer:'Sales Marketer',maintenance:'Maintenance',housekeeping:'Housekeeping'};
  document.getElementById('roleBadge').textContent=labels[role]||role;
  var defaults={director:'dashboard',admin:'dashboard',marketer:'dashboard',maintenance:'maintenance',housekeeping:'housekeeping'};
  ACTIVE=defaults[role]||'dashboard';
  buildNav();render(ACTIVE);
  document.getElementById('pageTitle').textContent=ACTIVE==='maintenance'?'Maintenance Tickets':ACTIVE==='housekeeping'?'Housekeeping Tasks':'Dashboard';
}

}

function rDash(){

  var mr=APTS.filter(function(a){return a.status==='make_ready';}).length;
  var notice=APTS.filter(function(a){return a.status==='on_notice';}).length;
  var rate=APTS.length?Math.round(occ/APTS.length*100):0;
  var hot=LEADS.filter(function(l){return l.urgency==='Hot';}).length;
  var openM=MAINT_TICKETS.filter(function(t){return t.status!=='completed';}).length;

  if(ROLE==='housekeeping') return rHKDash();
  if(ROLE==='marketer') return rSalesDash();

  return '<div class="stats"><div class="stat" onclick="go(\'occupancy\')"><div class="sl">Occupancy</div><div class="sv">'+rate+'%</div><div class="ss sg">'+occ+' of '+APTS.length+' units</div></div>'
    +'<div class="stat" onclick="go(\'apartments\')"><div class="sl">Available Units</div><div class="sv sg">'+avail+'</div><div class="ss">Ready to show</div></div>'
    +'<div class="stat" onclick="go(\'makeready\')"><div class="sl">Make-Ready</div><div class="sv sa">'+mr+'</div><div class="ss sr">In progress</div></div>'
    +'<div class="stat" onclick="go(\'apartments\')"><div class="sl">On-Notice</div><div class="sv sr">'+notice+'</div><div class="ss sa">Moving out soon</div></div>'
    +'<div class="stat" onclick="go(\'leads\')"><div class="sl">Hot Leads</div><div class="sv sr">'+hot+'</div><div class="ss">Need attention</div></div>'
    +'<div class="stat" onclick="go(\'maintenance\')"><div class="sl">Open Work Orders</div><div class="sv sr">'+openM+'</div><div class="ss sr">Require attention</div></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="card"><div class="card-hd"><div class="card-t">Unit Status</div><button class="btn btn-a btn-sm" onclick="go(\'apartments\')">View All</button></div>'
    +[['occupied','#4fc87a'],['available','#3d9ee8'],['make_ready','#f59e0b'],['reserved','#a78bfa'],['on_notice','#f87171']].map(function(e){
      var count=APTS.filter(function(a){return a.status===e[0];}).length;
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="width:10px;height:10px;border-radius:50%;background:'+e[1]+';flex-shrink:0"></div><div style="flex:1;font-size:13px;color:#c8d6e8">'+cap(e[0].replace(/_/g,' '))+'</div><div style="font-size:20px;font-weight:900;color:'+e[1]+'">'+count+'</div></div>';
    }).join('')+'</div>'
    +'<div class="card"><div class="card-hd"><div class="card-t">Operations Alerts</div></div>'
    +'<div style="display:flex;flex-direction:column;gap:8px">'
    +'<div style="background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.15);border-radius:8px;padding:10px 12px"><div style="font-size:12px;font-weight:700;color:#f87171">Unit 104 On-Notice</div><div style="font-size:11px;color:#6b7fa3;margin-top:2px">Earl Davis moving out Feb 28. <button class="btn btn-a btn-sm" onclick="scheduleMR(4)">Schedule Make-Ready</button></div></div>'
    +'<div style="background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);border-radius:8px;padding:10px 12px"><div style="font-size:12px;font-weight:700;color:#f59e0b">2 Units In Make-Ready</div><div style="font-size:11px;color:#6b7fa3;margin-top:2px">Units 103 and 108 — est. ready Feb 14-15. <button class="btn btn-x btn-sm" onclick="go(\'makeready\')">View Board</button></div></div>'
    +'<div style="background:rgba(79,200,122,.06);border:1px solid rgba(79,200,122,.15);border-radius:8px;padding:10px 12px"><div style="font-size:12px;font-weight:700;color:#4fc87a">2 Hot Leads</div><div style="font-size:11px;color:#6b7fa3;margin-top:2px">Dorothy Harrison and Gloria Tran need action today. <button class="btn btn-g btn-sm" onclick="go(\'leads\')">View Leads</button></div></div>'
    +'</div></div></div>';
}

function rLeads(){
  return '<div class="card"><div class="card-hd"><div style="display:flex;gap:8px"><input class="fi" id="ldSearch" placeholder="Search…" style="width:180px" oninput="filterLeads()"><select class="fi" id="ldSt" style="width:150px" onchange="filterLeads()"><option value="">All Status</option><option>Inquiry</option><option>Tour Scheduled</option><option>Proposal Sent</option><option>Move-In</option></select></div><button class="btn btn-a btn-sm" onclick="addLeadPrompt()">+ Add Lead</button></div>'
    +'<table class="tbl"><thead><tr><th>Name</th><th>Care</th><th>Status</th><th>Urgency</th><th>Source</th><th>Follow-Up</th><th>Actions</th></tr></thead><tbody id="ldTbody">'+buildLeadRows()+'</tbody></table></div>';
}
function buildLeadRows(){
  var q=(document.getElementById('ldSearch')||{value:''}).value.toLowerCase();
  var st=(document.getElementById('ldSt')||{value:''}).value;
  var filtered=LEADS.filter(function(l){return (!q||l.name.toLowerCase().includes(q)||l.care.toLowerCase().includes(q))&&(!st||l.status===st);});
  if(!filtered.length) return '<tr><td colspan="7" style="color:#4b6278;text-align:center;padding:20px">No leads found.</td></tr>';
  var sBadge=function(s){return s==='Move-In'?'bg':s==='Tour Scheduled'?'bb':s==='Proposal Sent'?'ba':'bx';};
  var uBadge=function(u){return u==='Hot'?'br':u==='Warm'?'ba':'bb';};
  return filtered.map(function(l){return'<tr><td style="font-weight:700;color:#f4f8ff">'+h(l.name)+'</td><td>'+h(l.care)+'</td><td><span class="badge '+sBadge(l.status)+'">'+h(l.status)+'</span></td><td><span class="badge '+uBadge(l.urgency)+'">'+(l.urgency||'—')+'</span></td><td style="font-size:11px">'+h(l.source)+'</td><td style="font-size:11px">'+(l.fu||'—')+'</td><td><button class="btn btn-a btn-sm" onclick="updateLeadStatus('+l.id+')">Update</button></td></tr>';}).join('');
}
function filterLeads(){var tb=document.getElementById('ldTbody');if(tb)tb.innerHTML=buildLeadRows();}
function addLeadPrompt(){
  var name=prompt('New lead full name:');
  if(!name) return;
  var care=prompt('Care level (Independent Living / Assisted Living / Memory Care):','Independent Living')||'Independent Living';
  LEADS.unshift({id:++nextId,name:name,care:care,status:'Inquiry',urgency:'Warm',source:'Direct',phone:'',fu:'',notes:''});
  T('Lead added: '+name);render('leads');
}
function updateLeadStatus(id){
  var l=LEADS.find(function(x){return x.id===id;});if(!l)return;
  var statuses=['Inquiry','Follow-up','Tour Scheduled','Proposal Sent','Decision Pending','Move-In'];
  var idx=statuses.indexOf(l.status);
  l.status=statuses[(idx+1)%statuses.length];
  T(l.name+' → '+l.status);
  var tb=document.getElementById('ldTbody');if(tb)tb.innerHTML=buildLeadRows();
}

// ─── MAKE-READY ─────────────────────────────────────────────────
function rMakeReady(){
  return '<div class="card"><div class="card-hd"><div class="card-t">Make-Ready Board</div><button class="btn btn-a btn-sm" onclick="addMRPrompt()">+ New Ticket</button></div>'
    +'<div id="mrFormArea"></div>'
    +MR_TICKETS.map(function(t){
      var done=t.tasks.filter(function(x){return x.startsWith('done:');}).length;
      return '<div style="background:#071120;border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:14px;margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-size:14px;font-weight:800;color:#f4f8ff">Unit '+h(t.unit)+' &mdash; '+h(t.type)+'</div><div style="font-size:11px;color:#4b6278;margin-top:2px">Move-out: '+h(t.moveout)+' &bull; Target: '+h(t.target)+' &bull; Assigned: '+h(t.assignee)+'</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:900;color:#f59e0b">'+t.pct+'%</div><span class="badge '+(t.pct>=100?'bg':t.pct>=50?'ba':'bb')+'">'+(t.pct>=100?'Complete':t.pct>=50?'In Progress':'Starting')+'</span></div></div>'
        +'<div class="pbar"><div class="pbar-f" style="width:'+t.pct+'%"></div></div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'
        +t.tasks.map(function(task,i){
          var done=task.startsWith('done:');
          var label=done?task.slice(5):task;
          return '<button class="badge '+(done?'bg':'bx')+'" onclick="toggleMRTask('+t.id+','+i+')" style="cursor:pointer;border:none;font-family:inherit">'+(done?'✓ ':'● ')+label+'</button>';
        }).join('')+'</div>'
        +'<div style="display:flex;gap:8px"><button class="btn btn-a btn-sm" onclick="advanceMR('+t.id+')">Mark 25% Progress</button><button class="btn btn-g btn-sm" onclick="completeMR('+t.id+')">Mark Complete</button></div>'
        +'</div>';
    }).join('')+'</div>';
}
function toggleMRTask(tid,idx){
  var t=MR_TICKETS.find(function(x){return x.id===tid;});if(!t)return;
  var task=t.tasks[idx];
  t.tasks[idx]=task.startsWith('done:')?task.slice(5):'done:'+task;
  var done=t.tasks.filter(function(x){return x.startsWith('done:');}).length;
  t.pct=Math.round(done/t.tasks.length*100);
  T('Task updated!');render('makeready');
}
function advanceMR(id){var t=MR_TICKETS.find(function(x){return x.id===id;});if(!t)return;t.pct=Math.min(100,t.pct+25);T('Progress: '+t.pct+'%');render('makeready');}
function completeMR(id){var t=MR_TICKETS.find(function(x){return x.id===id;});if(!t)return;t.pct=100;t.tasks=t.tasks.map(function(x){return x.startsWith('done:')?x:'done:'+x;});T('Unit marked lease-ready! ✓');render('makeready');}
function addMRPrompt(){
  var unit=prompt('Unit number:');if(!unit)return;
  var target=prompt('Target ready date (YYYY-MM-DD):',new Date(Date.now()+14*864e5).toISOString().split('T')[0])||'TBD';
  MR_TICKETS.push({id:++nextId,unit:unit,type:'Unit',moveout:'TBD',target:target,pct:0,tasks:['Trash out','Locks changed','Cleaning','Inspection'],assignee:'TBD'});
  T('Make-ready ticket created for Unit '+unit+'!');render('makeready');
}

  return '<div class="card"><div class="card-hd"><div class="card-t">Task Manager</div><button class="btn btn-a btn-sm" onclick="addTaskGold()">+ Add Task</button></div>'
    +'<div id="taskFormArea"></div>'
    +TASKS.map(function(t){return'<div style="display:flex;gap:11px;align-items:center;background:#071120;border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:11px 13px;margin-bottom:7px'+(t.done?';opacity:.5':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTaskGold('+t.id+',this)" style="accent-color:#f59e0b;width:14px;height:14px;flex-shrink:0"><div style="flex:1"><div style="font-size:13px;color:#f4f8ff;'+(t.done?'text-decoration:line-through':'')+'">'+h(t.title)+'</div><div style="font-size:10px;color:#4b6278">Due '+h(t.due)+' &bull; <span style="color:'+(t.priority==='High'?'#f87171':t.priority==='Med'?'#f59e0b':'#4fc87a')+'">'+h(t.priority)+'</span></div></div><button class="btn btn-r btn-sm" onclick="deleteTaskGold('+t.id+')">✕</button></div>';}).join('')+'</div>';
}
function addTaskGold(){
  var area=document.getElementById('taskFormArea');if(!area)return;
  area.innerHTML='<div style="background:#071120;border:1px solid rgba(245,158,11,.15);border-radius:10px;padding:14px;margin-bottom:12px"><div class="fg"><div class="fl fw"><div class="flb">Title *</div><input class="fi" id="tgTitle" placeholder="Task title"></div><div class="fl"><div class="flb">Due Date</div><input class="fi" type="date" id="tgDue"></div><div class="fl"><div class="flb">Priority</div><select class="fi" id="tgPri"><option value="High">High</option><option value="Med" selected>Medium</option><option value="Low">Low</option></select></div></div><div style="display:flex;gap:8px"><button class="btn btn-a btn-sm" onclick="saveTaskGold()">Add</button><button class="btn btn-x btn-sm" onclick="document.getElementById(\'taskFormArea\').innerHTML=\'\'">Cancel</button></div></div>';
}
function saveTaskGold(){var title=(document.getElementById('tgTitle')||{value:''}).value.trim();if(!title){T('Title required.','e');return;}TASKS.unshift({id:++nextId,title:title,due:(document.getElementById('tgDue')||{value:'TBD'}).value||'TBD',priority:(document.getElementById('tgPri')||{value:'Med'}).value,done:false});T('Task added!');go('tasks');}
function toggleTaskGold(id,cb){var t=TASKS.find(function(x){return x.id===id;});if(!t)return;t.done=cb.checked;T(t.done?'Done!':'Reopened.');render('tasks');}
function deleteTaskGold(id){TASKS=TASKS.filter(function(t){return t.id!==id;});T('Removed.');render('tasks');}

// ─── REPORTS ─────────────────────────────────────────────────────
function rReports(){
  var occ=Math.round(APTS.filter(function(a){return a.status==='occupied';}).length/APTS.length*100);
  return '<div class="stats"><div class="stat"><div class="sl">Occupancy</div><div class="sv sg">'+occ+'%</div></div><div class="stat"><div class="sl">Active Leads</div><div class="sv">'+LEADS.filter(function(l){return l.status!=='Move-In';}).length+'</div></div><div class="stat"><div class="sl">Open MR Tickets</div><div class="sv sa">'+MR_TICKETS.filter(function(t){return t.pct<100;}).length+'</div></div><div class="stat"><div class="sl">Open Maint.</div><div class="sv sr">'+MAINT_TICKETS.filter(function(t){return t.status!=='completed';}).length+'</div></div></div>'
    +'<div class="card"><div class="card-hd"><div class="card-t">Operations Summary</div><button class="btn btn-a btn-sm" onclick="exportGoldReport()">Export CSV</button></div>'
    +'<table class="tbl"><thead><tr><th>Category</th><th>Metric</th><th>Value</th><th>Status</th></tr></thead><tbody>'
    +[['Occupancy','Current Rate',occ+'%','bg'],['Sales','Active Leads',LEADS.filter(function(l){return l.status!=='Move-In';}).length,'ba'],['Operations','Make-Ready In Progress',MR_TICKETS.filter(function(t){return t.pct<100;}).length,'ba'],['Operations','Open Maintenance',MAINT_TICKETS.filter(function(t){return t.status!=='completed';}).length,'br'],['Operations','Available Units',APTS.filter(function(a){return a.status==='available';}).length,'bb'],['Operations','Housekeeping Tasks Due',HK_TASKS.filter(function(t){return t.status!=='completed';}).length,'ba']].map(function(r){return'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td style="font-weight:700;color:#f4f8ff">'+r[2]+'</td><td><span class="badge '+r[3]+'">'+( r[3]==='bg'?'Good':r[3]==='br'?'Needs Attention':'Active')+'</span></td></tr>';}).join('')+'</tbody></table></div>';
}
function exportGoldReport(){
  var rows=['Category,Metric,Value'];
  var occ=Math.round(APTS.filter(function(a){return a.status==='occupied';}).length/APTS.length*100);
  rows.push('Occupancy,Current Rate,'+occ+'%');
  rows.push('Sales,Active Leads,'+LEADS.filter(function(l){return l.status!=='Move-In';}).length);
  rows.push('Operations,Available Units,'+APTS.filter(function(a){return a.status==='available';}).length);
  APTS.forEach(function(a){rows.push('Apartment,Unit '+a.unit+' Status,'+a.status.replace(/_/g,' '));});
  var blob=new Blob([rows.join('\n')],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gold-report-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
  T('Report exported!');
}

// ─── SETTINGS ─────────────────────────────────────────────────────
function rSettings(){
  return '<div class="card"><div class="card-hd"><div class="card-t">Community Settings</div></div><div class="fg"><div class="fl"><div class="flb">Community Name</div><input class="fi" value="Sunrise Senior Living"></div><div class="fl"><div class="flb">Total Units</div><input class="fi" type="number" value="'+APTS.length+'"></div><div class="fl"><div class="flb">Phone</div><input class="fi" value="(214) 555-0100"></div><div class="fl"><div class="flb">City</div><input class="fi" value="Dallas, TX"></div></div><button class="btn btn-a" onclick="T(\'Settings saved!\')">Save Settings</button></div>'
    +'<div class="card"><div class="card-t" style="margin-bottom:8px">Subscription</div><div style="font-size:13px;color:#c8d6e8;margin-bottom:10px">Plan: <strong style="color:#f59e0b">CommunityLink Gold CRM — $999/month</strong> (Demo)</div><a href="pricing.html" class="btn btn-a" style="text-decoration:none;display:inline-block">View Pricing Plans</a></div>'
    +'<div class="card"><div class="card-t" style="margin-bottom:8px">User Seats</div><div style="font-size:13px;color:#c8d6e8;margin-bottom:10px">5 of 15 seats used (Gold plan)</div><button class="btn btn-a btn-sm" onclick="T(\'Invite sent! Check email.\')">+ Invite User</button></div>';
}

function cap(s){if(!s)return'';return s.charAt(0).toUpperCase()+s.slice(1);}

document.addEventListener('DOMContentLoaded',function(){
  buildNav();render('dashboard');
});
