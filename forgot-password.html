<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HospiceLink — Reset Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#081426;color:#f4f8ff}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:28px}
.logo-mark{font-size:28px;font-weight:900;color:#49b6ff;letter-spacing:-1px}
.logo-mark span{color:#ffd700}
.logo-sub{font-size:12px;color:#6b7fa3;margin-top:4px}
.card{background:#0d1b31;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:32px 28px}
.card-title{font-size:18px;font-weight:800;margin-bottom:6px}
.card-sub{font-size:13px;color:#6b7fa3;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:#8b9fc4;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.field input{width:100%;background:#0a1628;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px 14px;font-size:14px;color:#f4f8ff;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:#49b6ff}
.field input::placeholder{color:#3a4d6b}
.btn-main{width:100%;background:#49b6ff;color:#081426;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s}
.btn-main:hover{opacity:.88}
.success-box{background:rgba(140,255,102,.08);border:1px solid rgba(140,255,102,.3);border-radius:12px;padding:18px;text-align:center;display:none}
.success-box .icon{font-size:32px;margin-bottom:8px}
.success-box h3{font-size:16px;font-weight:800;color:#8cff66;margin-bottom:6px}
.success-box p{font-size:13px;color:#6b7fa3}
.back-link{text-align:center;margin-top:18px;font-size:13px;color:#6b7fa3}
.back-link a{color:#49b6ff;text-decoration:none;font-weight:700}
.err{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.4);border-radius:10px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">Hospice<span>Link</span></div>
    <div class="logo-sub">HIPAA-COMPLIANT HOSPICE CRM</div>
  </div>
  <div class="card">
    <div id="formSection">
      <div class="card-title">Reset your password</div>
      <div class="card-sub">Enter your email and we'll send you a reset link.</div>
      <div class="err" id="errMsg"></div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="emailIn" placeholder="you@agency.com">
      </div>
      <button class="btn-main" onclick="sendReset()">Send Reset Link</button>
    </div>
    <div class="success-box" id="successBox">
      <div class="icon">✉️</div>
      <h3>Check your email</h3>
      <p>A password reset link has been sent to <strong id="sentEmail"></strong>. The link expires in 1 hour.</p>
    </div>
    <div class="back-link"><a href="login.html">← Back to Login</a></div>
  </div>
</div>
<script>
const BACKEND='https://wemarketplus-backend-1.onrender.com';
function sendReset(){
  const email=document.getElementById('emailIn').value.trim();
  const err=document.getElementById('errMsg');
  err.style.display='none';
  if(!email){err.textContent='Please enter your email address.';err.style.display='block';return;}
  const btn=document.querySelector('.btn-main');
  btn.textContent='Sending…';btn.disabled=true;
  fetch(BACKEND+'/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})})
  .then(r=>r.json()).then(d=>{
    document.getElementById('formSection').style.display='none';
    document.getElementById('sentEmail').textContent=email;
    document.getElementById('successBox').style.display='block';
  }).catch(()=>{
    document.getElementById('formSection').style.display='none';
    document.getElementById('sentEmail').textContent=email;
    document.getElementById('successBox').style.display='block';
  });
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')sendReset();});
</script>
</body>
</html>
