<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      no-referrer app-wide: activation, email-verification and password-reset
      links carry a one-time token in the URL query string (?token=). Suppressing
      the Referer header stops that token leaking to any third party if a page
      ever links or loads a subresource off-origin (OWASP Forgot Password / URL
      query-string exposure guidance). A private CRM has no need to send referrers.
    -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081426" />
    <title>WeMarketPlus CRM</title>
    <!--
      CRM/auth screens use the system font stack ('Segoe UI', system-ui, Arial),
      matching crm-*.html / login.html. The marketing landing (index.html) uses
      the Outfit body font + Instrument Serif display headings (both loaded from
      Google Fonts, exactly as wemarketplus.com/index.html does), applied via the
      `.marketing-root` / `.font-serif-display` scopes on marketing pages only.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
