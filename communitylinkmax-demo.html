#mobile-nav {

}

@media(max-width:640px){
  #mobile-nav{display:flex !important;}
  .main,.sidebar+div,[class*="main"]{padding-bottom:66px !important;}
  /* Sidebar: hidden but accessible via menu */
  nav.sidebar,div.sidebar,.sidebar,#sidebar{display:none !important;}
  /* Main content: full width */
  .main{margin-left:0 !important;width:100% !important;min-width:0 !important;}
  /* Cards: better mobile padding */
  .card{padding:12px !important;border-radius:12px !important;margin-bottom:10px !important;}
  .card-h,.card-hd{flex-wrap:wrap !important;gap:8px !important;}
  /* Stats: 2-col on mobile */
  .stats,.kpi-grid{grid-template-columns:1fr 1fr !important;gap:8px !important;}
  .stat,.kpi{padding:10px 12px !important;border-radius:10px !important;}
  .sv,.kpi-val{font-size:22px !important;}
  /* Tables: scrollable */
  table{min-width:460px;}
  .tbl-wrap,.tbl-scroll{overflow-x:auto !important;-webkit-overflow-scrolling:touch;border-radius:8px;}
  /* Inputs: 16px prevents iOS zoom */
  input,select,textarea{font-size:16px !important;}
  /* Grids to column */
  .g2,.g3,.g4{grid-template-columns:1fr !important;}
  /* Modals: slide up from bottom */
  .op-modal{align-items:flex-end !important;padding:0 !important;}
  .op-modal>div{border-radius:18px 18px 0 0 !important;max-width:100% !important;width:100% !important;max-height:88vh !important;}
  /* Topbar: compact */
  .topbar{padding:10px 14px !important;}
  .topbar-title{font-size:14px !important;}
  /* Buttons: touch-friendly */
  .btn{min-height:38px;padding:9px 14px !important;font-size:12px !important;}
  .btn-sm{min-height:32px;padding:6px 10px !important;font-size:11px !important;}
  /* Form grid */
  [style*="grid-template-columns:1fr 1fr"]{display:flex !important;flex-direction:column !important;}
  /* Section headers */
  .sec-h{font-size:18px !important;}
  h2{font-size:18px !important;}
  /* Pipeline: horizontal scroll */
  .pipeline-wrap{overflow-x:auto !important;-webkit-overflow-scrolling:touch;}
  .pipeline-col{min-width:240px !important;}
  /* Chart containers */
  canvas,svg{max-width:100% !important;height:auto !important;}
  /* Role selector box */
  .role-box,.role-sel-wrap{padding:10px !important;}
  /* LOC table */
  .loc-table-wrap{overflow-x:auto !important;}
}
@media(max-width:380px){
  .stats{grid-template-columns:1fr !important;}
  .mob-nav-btn{font-size:7px !important;}
  .mob-icon{font-size:16px !important;}
  .sv{font-size:18px !important;}
}
@media(min-width:641px){
  #mobile-nav{display:none !important;}
  #mob-fab{display:none !important;}
}

function advanceRef(id){
  var r=PAID_REFERRALS.find(function(x){return x.id===id;});if(!r)return;
  var idx=REFERRAL_STAGES.indexOf(r.stage);
  if(r.stage==='Moved In'){T(r.name+' already moved in!','w');return;}
  if(r.stage==='Lost'){T(r.name+' is marked Lost — re-engage to reopen.','w');return;}
  if(idx<REFERRAL_STAGES.length-2){
    r.stage=REFERRAL_STAGES[idx+1];
    if(r.stage==='Moved In'&&r.feeStatus==='Pending') r.feeStatus='Paid';
    T(r.name+' advanced to: '+r.stage);
    render('referrals');
  } else {
    var reason=prompt('Mark as Lost — reason (Not interested / Chose competitor / Pricing / Medical decline / No response / Deceased / Duplicate / Other):','Not interested');
    if(reason){r.stage='Lost';r.lostReason=reason;r.feeStatus='N/A';T(r.name+' marked Lost.');render('referrals');}
  }
}

}

function toggleMRTask(tid,idx){
  var t=MR_TICKETS.find(function(x){return x.id===tid;});if(!t)return;
  var task=t.tasks[idx];
  t.tasks[idx]=task.startsWith('done:')?task.slice(5):'done:'+task;
  var done=t.tasks.filter(function(x){return x.startsWith('done:');}).length;
  t.pct=Math.round(done/t.tasks.length*100);

function calcDemoMileage(){
  // Simulate auto-calculation (in live CRM this calls Google Maps API)
  var to = (document.getElementById('ml-to')||{}).value||'';
  if(to.length > 5) {
    var est = (Math.random()*20+5).toFixed(1);
    var input = document.getElementById('ml-miles');
    var note = document.getElementById('ml-calc-note');
    if(input && !input.value) input.value = est;
    if(note) note.textContent = '(estimated — verify before submitting)';
    updateMileageReimb();
  }
}
function updateMileageReimb(){
  var miles = parseFloat((document.getElementById('ml-miles')||{}).value)||0;
  var preview = document.getElementById('ml-reimb-preview');
  if(preview) preview.textContent = '$'+(miles*DEMO_MILEAGE_RATE).toFixed(2);
}
function handleMileageFileSelect(input){
  if(!input.files||!input.files[0]) return;
  showMileageFilePreview(input.files[0]);
}
function handleMileageFileDrop(e){
  e.preventDefault();
  document.getElementById('ml-drop-zone').style.borderColor='rgba(245,158,11,.3)';
  var file = e.dataTransfer.files[0];
  if(file) showMileageFilePreview(file);
}
function showMileageFilePreview(file){
  var label = document.getElementById('ml-file-label');
  var preview = document.getElementById('ml-receipt-preview');
  if(label) label.textContent = '✅ '+file.name+' ('+Math.round(file.size/1024)+'KB)';
  if(preview){
    preview.style.display='';
    if(file.type.startsWith('image/')){
      var reader = new FileReader();
      reader.onload = function(e){
        preview.innerHTML='<img src="'+e.target.result+'" style="max-width:100%;max-height:120px;border-radius:6px;margin-bottom:4px"><br><span>'+file.name+'</span>';
      };
      reader.readAsDataURL(file);
    } else {
      preview.innerHTML='📄 '+file.name+' ready to submit';
    }
  }
  // Store file reference globally for form submission
  window._mlReceiptFile = file;
}
function saveDemoMileageLog(){
  var from = (document.getElementById('ml-from')||{}).value.trim();
  var to = (document.getElementById('ml-to')||{}).value.trim();
  var miles = parseFloat((document.getElementById('ml-miles')||{}).value)||0;
  if(!from||!to){T('From and To addresses are required','e');return;}
  if(!miles){T('Enter mileage','e');return;}
  var expType = (document.getElementById('ml-exp-type')||{}).value||'';
  var expAmt = parseFloat((document.getElementById('ml-exp-amt')||{}).value)||0;
  var hasReceipt = !!window._mlReceiptFile;
  DEMO_MILEAGE_LOGS.unshift({
    id:'ml'+Date.now(),
    date:(document.getElementById('ml-date')||{}).value||new Date().toISOString().split('T')[0],
    from_addr:from, to_addr:to, miles:miles,
    purpose:(document.getElementById('ml-purpose')||{}).value||'',
    reimbursement:parseFloat((miles*DEMO_MILEAGE_RATE).toFixed(2)),
    status:'pending',
    receipt:hasReceipt?(window._mlReceiptFile.name):null,
    expense_type:expType, expense_amt:expAmt,
    submitted_by:'Sarah M.',
  });
  window._mlReceiptFile = null;
  T('✅ Mileage logged'+(hasReceipt?' with receipt':'')+'! Reimbursement: $'+(miles*DEMO_MILEAGE_RATE).toFixed(2));
  ['ml-from','ml-to','ml-miles','ml-purpose','ml-exp-amt','ml-exp-notes'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  var label=document.getElementById('ml-file-label');if(label)label.textContent='Click or drag to upload receipt';
  var prev=document.getElementById('ml-receipt-preview');if(prev)prev.style.display='none';
  render('mileage');
}

function ntContactSearch(q){
  var dd = document.getElementById('nt-contact-dd');
  var opts = document.querySelectorAll('.nt-contact-opt');
  var addNew = document.getElementById('nt-add-new-opt');
  var addNewName = document.getElementById('nt-add-new-name');
  if(!dd) return;
  var qLower = (q||'').toLowerCase().trim();
  var anyVisible = false;
  opts.forEach(function(opt){
    var name = (opt.dataset.name||'').toLowerCase();
    var type = (opt.dataset.type||'').toLowerCase();
    var matches = !qLower || name.includes(qLower) || type.includes(qLower);
    opt.style.display = matches ? '' : 'none';
    // Highlight match
    if(qLower && matches) {
      var nameEl = opt.querySelector('.nt-opt-name');
      if(nameEl) {
        var orig = opt.dataset.name;
        var re = new RegExp('('+qLower.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        nameEl.innerHTML = h(orig).replace(re,'<mark style="background:#fef3c7;color:#92400e;border-radius:2px">$1</mark>');
      }
    }
    if(matches) anyVisible = true;
  });
  if(addNew && addNewName) {
    if(qLower && !anyVisible) {
      addNewName.textContent = q;
      addNew.style.display = '';
    } else {
      addNew.style.display = 'none';
    }
  }
  dd.style.display = (anyVisible || (qLower && !anyVisible)) ? '' : 'none';
}

function ntAddNewContact(){
  var input = document.getElementById('nt-contact-input');
  var name = input ? input.value.trim() : '';
  if(!name) return;
  var formatted = name.replace(/\b\w/g,function(l){return l.toUpperCase();});
  if(input) input.value = formatted;
  var hidId = document.getElementById('nt-contact-id');
  var dd = document.getElementById('nt-contact-dd');

function saveManualNote(){
  var summary=(document.getElementById('nt-summary')||{}).value.trim();
  if(!summary){T('Summary is required','e');return;}
  // Contact from new searchable typeahead
  var contactName=(document.getElementById('nt-contact-input')||{}).value||'';
  var contactId=(document.getElementById('nt-contact-id')||{}).value||'';
  // Fallback to old static select if typeahead not rendered
  if(!contactName){
    var leadSel=document.getElementById('nt-lead');
    if(leadSel&&leadSel.value){
      var opt=leadSel.options[leadSel.selectedIndex];
      contactName=opt?opt.text:'';
    }
  }
  var type=(document.getElementById('nt-type')||{}).value||'manual';
  var outcome=(document.getElementById('nt-outcome')||{}).value||'';
  // Next step: prefer dropdown selection, fall back to free text
  var nextStepSel=(document.getElementById('nt-nextstep-sel')||{}).value||'';
  var nextStepTxt=(document.getElementById('nt-nextstep')||{}).value||'';
  var nextStep = (nextStepSel && nextStepSel !== 'Other — type below') ? nextStepSel : nextStepTxt;
  var followDate=(document.getElementById('nt-followdate')||{}).value||null;
  var stage=(document.getElementById('nt-stage')||{}).value||'';
  // Role-based author
  var ROLE_USER_NAMES={director:'Executive Director',salesadmissions:'Sales/Admissions',owner:'Owner / Investor',admin:'Administrator',marketer:'Sarah M. (Sales Marketer)',maintenance:'Maintenance Team',housekeeping:'Housekeeping Team'};
  var enteredBySel = (document.getElementById('nt-entered-by')||{}).value||'auto';
  var author = enteredBySel === 'auto' ? (ROLE_USER_NAMES[ROLE] || ROLE) : enteredBySel;

  NOTES.unshift({
    id:++nextId,
    type:'manual',
    comm_type:type,
    contact_name:contactName,
    contact_id:contactId,
    summary:summary,
    outcome:outcome,
    next_step:nextStep,
    follow_up_date:followDate,
    stage:stage,
    created_at:new Date().toISOString(),
    user_name:author,
  });
  T('📝 Note saved to activity timeline!');
  // Reset form fields
  ['nt-summary','nt-outcome','nt-nextstep','nt-contact-input','nt-contact-id'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  render('notes');
}

// UNIFIED NOTE WRITER (DEMO) — pushes every Aircall activity
// into the in-memory NOTES array so it appears in the Notes tab
// ══════════════════════════════════════════════════════════════
function _addNoteFromAircall(noteData) {
  var TYPE_ICONS  = {call:'📞',text:'💬',email:'✉️',missed_call:'📵',failed_text:'⚠️',failed_email:'⚠️'};
  var TYPE_LABELS = {call:'Phone Call',text:'Text Message',email:'Email',
                     missed_call:'Missed Call',failed_text:'Failed Text',failed_email:'Failed Email'};
  var icon  = TYPE_ICONS[noteData.comm_type]  || '📋';
  var label = TYPE_LABELS[noteData.comm_type] || noteData.comm_type;

  NOTES.unshift({
    id: ++nextId,
    type: 'aircall',
    comm_type: noteData.comm_type,
    contact_name: noteData.contact_name || '',
    summary: icon+' ['+label+'] '+(noteData.contact_name||'')+' — '+(noteData.summary||noteData.outcome||''),
    outcome: noteData.outcome || '',
    next_step: noteData.next_step || '',
    follow_up_date: noteData.follow_up_date || null,
    created_at: new Date().toISOString(),
    user_name: 'Sarah M.',
  });

  T(icon+' Activity logged to Notes tab!');
  // If Notes tab is active, refresh it
  if(ACTIVE==='notes') render('notes');
}

function saveLedgerEntry(){
  var amount = parseFloat((document.getElementById('le-amount')||{}).value)||0;
  var type = (document.getElementById('le-type')||{}).value||'Other';
  if(!amount){ T('Amount is required','e'); return; }
  var cat = (document.getElementById('le-cat')||{}).value||'Revenue';
  var isRevenue = cat === 'Revenue' || cat === 'Deposit';
  // Update REVENUE_MONTHS for current month
  if(typeof REVENUE_MONTHS !== 'undefined' && REVENUE_MONTHS.length) {
    if(isRevenue) REVENUE_MONTHS[0].act += amount;
    else REVENUE_MONTHS[0].act -= amount;
  }
  T('Ledger entry posted: '+type+' $'+amount.toFixed(2));
  closeModal('modal-add-ledger');
  if(typeof render==='function') render('ledger');
}

    <div>
      <div style="font-size:15px;font-weight:900;color:#f4f8ff">All Modules</div>
      <div style="font-size:10px;color:#6b7fa3;margin-top:1px">Tap any section to navigate</div>
    </div>
    <button onclick="toggleMobMenu()" style="background:none;border:none;color:#6b7fa3;font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.04)">&times;</button>
  </div>
  <div id="mob-menu-links" style="padding:10px 8px 80px"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// MOBILE NAVIGATION + RESPONSIVE SYSTEM
// Works across all CRM and Demo pages
// ════════════════════════════════════════════════════════════════
function setMobNav(key){
  document.querySelectorAll('.mob-nav-btn').forEach(function(b){b.classList.remove('active');});
  var el=document.getElementById('mobnav-'+key);
  if(el)el.classList.add('active');
}

var _mobMenuOpen=false;
function toggleMobMenu(){
  _mobMenuOpen=!_mobMenuOpen;
  var overlay=document.getElementById('mob-menu-overlay');
  var panel=document.getElementById('mob-menu-panel');
  if(panel) panel.style.transform=_mobMenuOpen?'translateX(0px)':'translateX(-100%)';
  if(overlay) overlay.style.display=_mobMenuOpen?'block':'none';
  if(_mobMenuOpen) _buildMobMenuLinks();
}

function _buildMobMenuLinks(){
  var links=document.getElementById('mob-menu-links');
  if(!links) return;
  
  // Try CL-style NAV (object with role keys)
  var navItems=[];
  if(typeof NAV!=='undefined'&&typeof ROLE!=='undefined'&&NAV[ROLE]){
    NAV[ROLE].forEach(function(sec){
      navItems.push({sec:sec.sec,items:sec.items.map(function(item){
        return {k:item.k,l:item.l};
      })});
    });
  }
  // Try HL-style ROLE_TABS (array of tab keys)
  else if(typeof ROLE_TABS!=='undefined'&&typeof currentRole!=='undefined'){
    var tabs=ROLE_TABS[currentRole]||ROLE_TABS['admin']||[];
    var TAB_LABELS={'dash':'Dashboard','leads':'Lead Pipeline','notes':'Notes','aircall':'Aircall',
      'refs':'Referral Sources','pipeline':'Pipeline','territory':'Territory','records':'Prospects',
      'timeline':'Timeline','schedule':'Smart Schedule','aiasst':'AI Assistant','evv':'Mileage/EVV',
      'reports':'Reports','settings':'Settings','team':'Team Management'};
    navItems=[{sec:'NAVIGATION',items:tabs.slice(0,16).map(function(k){return {k:k,l:TAB_LABELS[k]||k};})}];
  }
  
  if(!navItems.length){
    links.innerHTML='<div style="padding:12px;color:#6b7fa3;font-size:12px">Navigation not available</div>';
    return;
  }
  
  links.innerHTML=navItems.map(function(sec){
    return '<div style="margin-bottom:4px">'
      +'<div style="font-size:9px;font-weight:900;color:#4b6278;letter-spacing:.1em;text-transform:uppercase;padding:8px 8px 4px">'+sec.sec+'</div>'
      +sec.items.filter(function(item){return item.l;}).map(function(item){
        // Detect which navigation function to use
        var navFn='';
        if(typeof go==='function') navFn="go('"+item.k+"');toggleMobMenu();setMobNav('"+item.k+"')";
        else if(typeof showTab==='function') navFn="showTab('"+item.k+"');toggleMobMenu()";
        else navFn="toggleMobMenu()";
        return '<button onclick="'+navFn+'" style="display:flex;align-items:center;width:100%;padding:10px 12px;background:none;border:none;color:#c8d6e8;font-size:13px;font-family:inherit;cursor:pointer;border-radius:8px;text-align:left;transition:background .1s" onmouseenter="this.style.background=\'rgba(255,255,255,.06)\'" onmouseleave="this.style.background=\'none\'">'+item.l+'</button>';
      }).join('')
      +'</div>';
  }).join('');
}

// Mobile quick-add FAB (floating action button) 
function _buildMobFAB(){
  if(window.innerWidth>640) return;
  if(document.getElementById('mob-fab')) return;
  var fab=document.createElement('div');
  fab.id='mob-fab';
  fab.style.cssText='position:fixed;bottom:72px;right:16px;z-index:999;';
  var mainBtn=document.createElement('button');
  mainBtn.style.cssText='width:52px;height:52px;border-radius:50%;background:#f59e0b;border:none;color:#06080e;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(245,158,11,.4);font-family:inherit;display:flex;align-items:center;justify-content:center;transition:transform .15s';
  mainBtn.innerHTML='&#43;';
  mainBtn.onclick=function(){
    var menu=document.getElementById('mob-fab-menu');
    if(menu) menu.style.display=menu.style.display==='none'?'flex':'none';
  };
  var fabMenu=document.createElement('div');
  fabMenu.id='mob-fab-menu';
  fabMenu.style.cssText='display:none;flex-direction:column;gap:8px;align-items:flex-end;margin-bottom:8px;';
  
  var quickActions=[
    {label:'Add Lead',fn:"addLeadPrompt&&addLeadPrompt()||T&&T('Add Lead')"},
    {label:'Add Note',fn:"(typeof go==='function'?go('notes'):showTab&&showTab('notes'))"},
    {label:'New Ticket',fn:"addMaintPrompt&&addMaintPrompt()||T&&T('New Ticket')"},
    {label:'Log Mileage',fn:"(typeof go==='function'?go('mileage'):showTab&&showTab('evv'))"},
  ];
  
  fabMenu.innerHTML=quickActions.map(function(a){
    return '<button onclick="'+a.fn+';document.getElementById(\'mob-fab-menu\').style.display=\'none\'" style="background:#0a1628;border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:8px 16px;color:#f59e0b;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.4)">'+a.label+'</button>';
  }).join('');
  
  fab.appendChild(fabMenu);
  fab.appendChild(mainBtn);
  document.body.appendChild(fab);
}

// Init mobile features
(function initMobile(){
  if(window.innerWidth<=640){
    _buildMobFAB();
  }
  window.addEventListener('resize',function(){
    var fab=document.getElementById('mob-fab');
    if(window.innerWidth<=640){
      if(!fab) _buildMobFAB();
      else fab.style.display='';
    } else {
      if(fab) fab.style.display='none';
      if(_mobMenuOpen) toggleMobMenu();
    }
  });
})();

</script>
</body>
</html>
