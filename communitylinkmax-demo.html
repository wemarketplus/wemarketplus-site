.role-sel{width:100%;background:#0a1628;border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;color:#f0f5ff;outline:none;cursor:pointer;font-family:inherit}

.sb-nav{flex:1;overflow-y:auto;padding:0 8px 8px}

.nav-sec{display:block;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#1e3a5f;padding:10px 6px 3px}
.nb{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:#7a9abf;background:transparent;border:none;font-family:inherit;transition:background .1s,color .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.page-title{font-size:15px;font-weight:800;color:#f4f8ff}
.page-sub{font-size:11px;color:#4b6278}
.tb-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#06080e;border:none;border-radius:999px;padding:7px 18px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.content{flex:1;overflow-y:auto;padding:20px}

.content::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
.card{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:14px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-t{font-size:13px;font-weight:800;color:#f4f8ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:rgba(245,158,11,.3)}
.sl{font-size:10px;font-weight:700;color:#4b6278;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}

.fl{display:flex;flex-direction:column;gap:4px}

.pbar-f{height:100%;background:#f59e0b;border-radius:99px;transition:width .4s}
#toast{position:fixed;bottom:20px;right:20px;background:#0d1b31;border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;color:#f4f8ff;z-index:99999;opacity:0;transform:translateY(8px);transition:all .22s;pointer-events:none}

function buildNav(){
  var nav=document.getElementById('sideNav');
  nav.innerHTML='';
  (NAV[ROLE]||NAV.admin).forEach(function(grp){
    nav.innerHTML+='<span class="nav-sec">'+grp.sec+'</span>';
    grp.items.forEach(function(item){
      nav.innerHTML+='<button class="nb'+(ACTIVE===item.k?' on':'')+'" onclick="go(\''+item.k+'\')">'+item.l+'</button>';
    });
  });
}
function go(key){

function rLeads(){

    +'<table class="tbl"><thead><tr><th>Name</th><th>Care</th><th>Status</th><th>Urgency</th><th>Source</th><th>Follow-Up</th><th>Actions</th></tr></thead><tbody id="ldTbody">'+buildLeadRows()+'</tbody></table></div>';

function buildLeadRows(){
  var q=(document.getElementById('ldSearch')||{value:''}).value.toLowerCase();
  var st=(document.getElementById('ldSt')||{value:''}).value;
  var filtered=LEADS.filter(function(l){return (!q||l.name.toLowerCase().includes(q)||l.care.toLowerCase().includes(q))&&(!st||l.status===st);});
  if(!filtered.length) return '<tr><td colspan="7" style="color:#4b6278;text-align:center;padding:20px">No leads found.</td></tr>';
  var sBadge=function(s){return s==='Move-In'?'bg':s==='Tour Scheduled'?'bb':s==='Proposal Sent'?'ba':'bx';};
  var uBadge=function(u){return u==='Hot'?'br':u==='Warm'?'ba':'bb';};
  return filtered.map(function(l){return'<tr><td style="font-weight:700;color:#f4f8ff">'+h(l.name)+'</td><td>'+h(l.care)+'</td><td><span class="badge '+sBadge(l.status)+'">'+h(l.status)+'</span></td><td><span class="badge '+uBadge(l.urgency)+'">'+(l.urgency||'—')+'</span></td><td style="font-size:11px">'+h(l.source)+'</td><td style="font-size:11px">'+(l.fu||'—')+'</td><td><button class="btn btn-a btn-sm" onclick="updateLeadStatus('+l.id+')">Update</button></td></tr>';}).join('');
}
function filterLeads(){var tb=document.getElementById('ldTbody');if(tb)tb.innerHTML=buildLeadRows();}
function addLeadPrompt(){
  var name=prompt('New lead full name:');
  if(!name) return;
  var care=prompt('Care level (Independent Living / Assisted Living / Memory Care):','Independent Living')||'Independent Living';
  LEADS.unshift({id:++nextId,name:name,care:care,status:'Inquiry',urgency:'Warm',source:'Direct',phone:'',fu:'',notes:''});
  T('Lead added: '+name);render('leads');
}
function updateLeadStatus(id){
  var l=LEADS.find(function(x){return x.id===id;});if(!l)return;
  var statuses=['Inquiry','Follow-up','Tour Scheduled','Proposal Sent','Decision Pending','Move-In'];
  var idx=statuses.indexOf(l.status);
  l.status=statuses[(idx+1)%statuses.length];
  T(l.name+' → '+l.status);
  var tb=document.getElementById('ldTbody');if(tb)tb.innerHTML=buildLeadRows();
}

function rMakeReady(){
  return '<div class="card"><div class="card-hd"><div class="card-t">Make-Ready Board</div><button class="btn btn-a btn-sm" onclick="addMRPrompt()">+ New Ticket</button></div>'
    +'<div id="mrFormArea"></div>'
    +MR_TICKETS.map(function(t){
      var done=t.tasks.filter(function(x){return x.startsWith('done:');}).length;
      return '<div style="background:#071120;border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:14px;margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-size:14px;font-weight:800;color:#f4f8ff">Unit '+h(t.unit)+' &mdash; '+h(t.type)+'</div><div style="font-size:11px;color:#4b6278;margin-top:2px">Move-out: '+h(t.moveout)+' &bull; Target: '+h(t.target)+' &bull; Assigned: '+h(t.assignee)+'</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:900;color:#f59e0b">'+t.pct+'%</div><span class="badge '+(t.pct>=100?'bg':t.pct>=50?'ba':'bb')+'">'+(t.pct>=100?'Complete':t.pct>=50?'In Progress':'Starting')+'</span></div></div>'
        +'<div class="pbar"><div class="pbar-f" style="width:'+t.pct+'%"></div></div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'
        +t.tasks.map(function(task,i){
          var done=task.startsWith('done:');
          var label=done?task.slice(5):task;
          return '<button class="badge '+(done?'bg':'bx')+'" onclick="toggleMRTask('+t.id+','+i+')" style="cursor:pointer;border:none;font-family:inherit">'+(done?'✓ ':'● ')+label+'</button>';
        }).join('')+'</div>'
        +'<div style="display:flex;gap:8px"><button class="btn btn-a btn-sm" onclick="advanceMR('+t.id+')">Mark 25% Progress</button><button class="btn btn-g btn-sm" onclick="completeMR('+t.id+')">Mark Complete</button></div>'
        +'</div>';
    }).join('')+'</div>';
}
function toggleMRTask(tid,idx){
  var t=MR_TICKETS.find(function(x){return x.id===tid;});if(!t)return;
  var task=t.tasks[idx];
  t.tasks[idx]=task.startsWith('done:')?task.slice(5):'done:'+task;
  var done=t.tasks.filter(function(x){return x.startsWith('done:');}).length;
  t.pct=Math.round(done/t.tasks.length*100);
  T('Task updated!');render('makeready');
}
function advanceMR(id){var t=MR_TICKETS.find(function(x){return x.id===id;});if(!t)return;t.pct=Math.min(100,t.pct+25);T('Progress: '+t.pct+'%');render('makeready');}
function completeMR(id){var t=MR_TICKETS.find(function(x){return x.id===id;});if(!t)return;t.pct=100;t.tasks=t.tasks.map(function(x){return x.startsWith('done:')?x:'done:'+x;});T('Unit marked lease-ready! ✓');render('makeready');}
function addMRPrompt(){
  var unit=prompt('Unit number:');if(!unit)return;
  var target=prompt('Target ready date (YYYY-MM-DD):',new Date(Date.now()+14*864e5).toISOString().split('T')[0])||'TBD';
  MR_TICKETS.push({id:++nextId,unit:unit,type:'Unit',moveout:'TBD',target:target,pct:0,tasks:['Trash out','Locks changed','Cleaning','Inspection'],assignee:'TBD'});
  T('Make-ready ticket created for Unit '+unit+'!');render('makeready');
}

  CONCESSION_DATA.unshift({id:newId,unit:document.getElementById('con-unit').value.trim()||'TBD',resident:res,type:document.getElementById('con-type').value,value:val,status:'pending',by:'Demo User'});
  document.getElementById('conAddArea').innerHTML='';
  go('concessions');
  T('Concession request submitted for approval!');
}

// ── LOC Pricing Calculator ───────────────────────────────
function rLOC(){
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'
    +'<div class="card"><div class="card-hd"><div class="card-t">Base Rate Configuration</div>'
    +'<button class="btn btn-a btn-sm" onclick="saveLOCRates()">Save Rates</button></div>'
    +'<div class="fg">'
    +'<div class="fl"><div class="flb">IL Base Rate ($/mo)</div><input class="fi" type="number" id="loc-il" value="'+LOC_BASE.IL+'"></div>'
    +'<div class="fl"><div class="flb">AL Base Rate ($/mo)</div><input class="fi" type="number" id="loc-al" value="'+LOC_BASE.AL+'"></div>'
    +'<div class="fl"><div class="flb">MC Base Rate ($/mo)</div><input class="fi" type="number" id="loc-mc" value="'+LOC_BASE.MC+'"></div>'
    +'<div class="fl"><div class="flb">LOC Add-on per Level ($)</div><input class="fi" type="number" id="loc-add" value="'+LOC_BASE.addon+'"></div>'
    +'</div></div>'
    +'<div class="card"><div class="card-hd"><div class="card-t">Quick Rate Calculator</div></div>'
    +'<div class="fg">'
    +'<div class="fl"><div class="flb">Care Level</div><select class="fi" id="calc-care"><option value="IL">Independent Living</option><option value="AL">Assisted Living</option><option value="MC">Memory Care</option></select></div>'
    +'<div class="fl"><div class="flb">LOC Score (1–5)</div><input class="fi" type="number" id="calc-loc" min="1" max="5" value="2"></div>'
    +'<div class="fl"><div class="flb">Second Person?</div><select class="fi" id="calc-2nd"><option value="0">No</option><option value="600">Yes (+$600)</option></select></div>'
    +'<div class="fl"><div class="flb">Parking ($/mo)</div><input class="fi" type="number" id="calc-park" value="0"></div>'
    +'</div>'
    +'<button class="btn btn-g" onclick="calcLOC()" style="margin-top:8px">Calculate</button>'
    +'<div id="locResult" style="display:none;margin-top:14px;background:#071120;border:1px solid rgba(79,200,122,.15);border-radius:10px;padding:16px">'
    +'<div style="font-size:11px;color:#4b6278;font-weight:700;text-transform:uppercase;margin-bottom:6px">Estimated Monthly Rate</div>'
    +'<div style="font-size:40px;font-weight:900;color:#4fc87a" id="locResultAmt">$0</div>'
    +'<div style="font-size:11px;color:#6b7fa3;margin-top:4px" id="locResultNote"></div>'
    +'</div></div>'
    +'</div>'
    +'<div class="card"><div class="card-hd"><div class="card-t">Level of Care Schedule</div></div>'
    +'<table class="tbl"><thead><tr><th>Level</th><th>IL Total</th><th>AL Total</th><th>MC Total</th><th>Services</th></tr></thead><tbody id="locTable"></tbody></table>'
    +'</div>';
  // Note: buildLOCTable() called after innerHTML set
}
function calcLOC(){
  var care=document.getElementById('calc-care').value;
  var loc=parseInt(document.getElementById('calc-loc').value)||1;
  var second=parseInt(document.getElementById('calc-2nd').value)||0;
  var park=parseInt(document.getElementById('calc-park').value)||0;
  var il=parseInt(document.getElementById('loc-il').value)||LOC_BASE.IL;
  var al=parseInt(document.getElementById('loc-al').value)||LOC_BASE.AL;
  var mc=parseInt(document.getElementById('loc-mc').value)||LOC_BASE.MC;
  var addon=parseInt(document.getElementById('loc-add').value)||LOC_BASE.addon;
  var bases={IL:il,AL:al,MC:mc};
  var total=bases[care]+(loc-1)*addon+second+park;
  var el=document.getElementById('locResult');if(el)el.style.display='block';
  var amt=document.getElementById('locResultAmt');if(amt)amt.textContent='$'+total.toLocaleString();
  var note=document.getElementById('locResultNote');if(note)note.textContent=care+' Level '+loc+(second?' + 2nd person':'')+' + $'+(park)+' parking';
  buildLOCTable();
}
function saveLOCRates(){
  LOC_BASE.IL=parseInt(document.getElementById('loc-il').value)||3200;
  LOC_BASE.AL=parseInt(document.getElementById('loc-al').value)||4500;
  LOC_BASE.MC=parseInt(document.getElementById('loc-mc').value)||5800;
  LOC_BASE.addon=parseInt(document.getElementById('loc-add').value)||150;
  buildLOCTable();
  T('LOC rates saved! Calculator updated.');
}
function buildLOCTable(){
  var tbody=document.getElementById('locTable');
  if(!tbody)return;
  var services=['Medication mgmt, minor ADL','+ Bathing, dressing, mobility','+ Incontinence, transfers','+ 24hr supervision, secured unit','+ Dementia care, behavioral support'];
  tbody.innerHTML=[1,2,3,4,5].map(function(l,i){
    return '<tr>'
      +'<td style="font-weight:700;color:#f4f8ff">Level '+l+'</td>'
      +'<td style="color:#3d9ee8;font-weight:700">$'+(LOC_BASE.IL+(l-1)*LOC_BASE.addon).toLocaleString()+'</td>'
      +'<td style="color:#f59e0b;font-weight:700">$'+(LOC_BASE.AL+(l-1)*LOC_BASE.addon).toLocaleString()+'</td>'
      +'<td style="color:#4fc87a;font-weight:700">$'+(LOC_BASE.MC+(l-1)*LOC_BASE.addon).toLocaleString()+'</td>'
      +'<td style="font-size:11px;color:#6b7fa3">'+services[i]+'</td>'
      +'</tr>';
  }).join('');
}

// Override render() to call buildLOCTable after setting innerHTML
var _origRender=render;
function render(key){
  _origRender(key);
  if(key==='loc'){setTimeout(buildLOCTable,10);}
}

// ── Competitor Intel ─────────────────────────────────────
function rCompetitors(){
  return '<div class="card"><div class="card-hd"><div class="card-t">Competitor Tracker</div>'
    +'<button class="btn btn-a btn-sm" onclick="addCompetitorPrompt()">+ Add Competitor</button></div>'

    +'<table class="tbl"><thead><tr><th>Community</th><th>City</th><th>Distance</th><th>IL Rate</th><th>AL Rate</th><th>MC Rate</th><th>Occupancy</th><th>Notes</th><th></th></tr></thead><tbody id="compRows">'
    +renderCompRows()
    +'</tbody></table></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="card">'
    +'<div class="card-hd"><div class="card-t">Rate Comparison (AL)</div></div>'

      return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)">'
        +'<span style="font-size:12px;color:#c8d6e8">'+r[0]+'</span>'
        +'<span style="font-size:13px;font-weight:700;color:'+r[2]+'">'+r[1]+'</span>'
        +'</div>';
    }).join('')+'</div>'
    +'<div class="card"><div class="card-hd"><div class="card-t">Market Summary</div></div>'
    +'<div style="font-size:12px;color:#6b7fa3;line-height:1.8">'
    +'<div style="margin-bottom:8px;color:#f4f8ff;font-weight:700">February 2026</div>'
    +'<div>• Your AL rate ($4,100) is <span style="color:#4fc87a">below market avg</span> ($4,375) — opportunity to increase</div>'
    +'<div>• Cottonwood Creek offering 1st month free — counter with amenities</div>'
    +'<div>• Heritage Pines on waitlist for 2BR — capture overflow demand</div>'
    +'<div>• Meadowbrook renovation attracting premium move-ins</div>'
    +'</div>'
    +'<button class="btn btn-a btn-sm" style="margin-top:12px" onclick="T(\'Rate review meeting scheduled for next Monday!\')">Schedule Rate Review</button>'
    +'</div></div>';
}
function renderCompRows(){
  return COMPETITOR_DATA.map(function(c){
    var occPct=parseInt(c.occ)||0;
    var occBadge=occPct>=90?'badge-g':occPct>=80?'badge-a':'badge-r';
    return '<tr>'
      +'<td style="font-weight:700;color:#f4f8ff">'+h(c.name)+'</td>'
      +'<td>'+h(c.city)+'</td>'
      +'<td>'+c.dist+' mi</td>'
      +'<td>'+h(c.il)+'</td>'
      +'<td>'+h(c.al)+'</td>'
      +'<td>'+h(c.mc)+'</td>'
      +'<td><span class="badge '+occBadge+'">'+h(c.occ)+'</span></td>'
      +'<td style="font-size:11px;color:#6b7fa3;max-width:140px">'+h(c.notes)+'</td>'
      +'<td><button class="btn btn-x btn-sm" onclick="T(\'Competitor notes updated!\')">Edit</button></td>'
      +'</tr>';
  }).join('');
}
function addCompetitorPrompt(){
  var area=document.getElementById('compAddArea');
  area.innerHTML='<div style="background:#071120;border:1px solid rgba(245,158,11,.15);border-radius:10px;padding:14px;margin-bottom:14px">'
    +'<div class="fg">'
    +'<div class="fl"><div class="flb">Community Name</div><input class="fi" id="comp-name" placeholder="Sunrise Gardens"></div>'
    +'<div class="fl"><div class="flb">City</div><input class="fi" id="comp-city" placeholder="Dallas"></div>'
    +'<div class="fl"><div class="flb">Distance (mi)</div><input class="fi" type="number" id="comp-dist" placeholder="2.4" step="0.1"></div>'
    +'<div class="fl"><div class="flb">AL Rate</div><input class="fi" id="comp-al" placeholder="$4,200"></div>'
    +'<div class="fl"><div class="flb">Occupancy</div><input class="fi" id="comp-occ" placeholder="88%"></div>'
    +'<div class="fl"><div class="flb">Notes</div><input class="fi" id="comp-notes" placeholder="Promotions, strengths..."></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn btn-a btn-sm" onclick="saveCompetitor()">Add</button>'
    +'<button class="btn btn-x btn-sm" onclick="clearCompArea()">Cancel</button>'
    +'</div></div>';
}
function saveCompetitor(){
  var name=document.getElementById('comp-name').value.trim();
  if(!name){T('Name required.','e');return;}
  COMPETITOR_DATA.unshift({name:name,city:document.getElementById('comp-city').value.trim(),dist:parseFloat(document.getElementById('comp-dist').value)||0,il:'N/A',al:document.getElementById('comp-al').value.trim()||'N/A',mc:'N/A',occ:document.getElementById('comp-occ').value.trim()||'—',notes:document.getElementById('comp-notes').value.trim()});
  document.getElementById('compAddArea').innerHTML='';
  go('competitors');
  T('Competitor added!');
}


function clearConArea(){document.getElementById('conAddArea').innerHTML='';}
function clearCompArea(){document.getElementById('compAddArea').innerHTML='';}
</script>
