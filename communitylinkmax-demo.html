function buildNav(){

  nav.innerHTML='';
  (NAV[ROLE]||NAV.admin).forEach(function(grp){
    nav.innerHTML+='<span class="nav-sec">'+grp.sec+'</span>';
    grp.items.forEach(function(item){
      nav.innerHTML+='<button class="nb'+(ACTIVE===item.k?' on':'')+'" onclick="go(\''+item.k+'\')">'+item.l+'</button>';
    });
  });
}

function buildLeadRows(){
  var q=(document.getElementById('ldSearch')||{value:''}).value.toLowerCase();
  var st=(document.getElementById('ldSt')||{value:''}).value;
  var filtered=LEADS.filter(function(l){return (!q||l.name.toLowerCase().includes(q)||l.care.toLowerCase().includes(q))&&(!st||l.status===st);});
  if(!filtered.length) return '<tr><td colspan="7" style="color:#4b6278;text-align:center;padding:20px">No leads found.</td></tr>';
  var sBadge=function(s){return s==='Move-In'?'bg':s==='Tour Scheduled'?'bb':s==='Proposal Sent'?'ba':'bx';};
  var uBadge=function(u){return u==='Hot'?'br':u==='Warm'?'ba':'bb';};
  return filtered.map(function(l){return'<tr><td style="font-weight:700;color:#f4f8ff">'+h(l.name)+'</td><td>'+h(l.care)+'</td><td><span class="badge '+sBadge(l.status)+'">'+h(l.status)+'</span></td><td><span class="badge '+uBadge(l.urgency)+'">'+(l.urgency||'—')+'</span></td><td style="font-size:11px">'+h(l.source)+'</td><td style="font-size:11px">'+(l.fu||'—')+'</td><td><button class="btn btn-a btn-sm" onclick="updateLeadStatus('+l.id+')">Update</button></td></tr>';}).join('');
}
function filterLeads(){var tb=document.getElementById('ldTbody');if(tb)tb.innerHTML=buildLeadRows();}
function addLeadPrompt(){
  var name=prompt('New lead full name:');
  if(!name) return;
  var care=prompt('Care level (Independent Living / Assisted Living / Memory Care):','Independent Living')||'Independent Living';
  LEADS.unshift({id:++nextId,name:name,care:care,status:'Inquiry',urgency:'Warm',source:'Direct',phone:'',fu:'',notes:''});
  T('Lead added: '+name);render('leads');
}
function updateLeadStatus(id){
  var l=LEADS.find(function(x){return x.id===id;});if(!l)return;
  var statuses=['Inquiry','Follow-up','Tour Scheduled','Proposal Sent','Decision Pending','Move-In'];
  var idx=statuses.indexOf(l.status);
  l.status=statuses[(idx+1)%statuses.length];
  T(l.name+' → '+l.status);
  var tb=document.getElementById('ldTbody');if(tb)tb.innerHTML=buildLeadRows();
}

function calcLOC(){
  var care=document.getElementById('calc-care').value;
  var loc=parseInt(document.getElementById('calc-loc').value)||1;
  var second=parseInt(document.getElementById('calc-2nd').value)||0;
  var park=parseInt(document.getElementById('calc-park').value)||0;
  var il=parseInt(document.getElementById('loc-il').value)||LOC_BASE.IL;
  var al=parseInt(document.getElementById('loc-al').value)||LOC_BASE.AL;
  var mc=parseInt(document.getElementById('loc-mc').value)||LOC_BASE.MC;
  var addon=parseInt(document.getElementById('loc-add').value)||LOC_BASE.addon;
  var bases={IL:il,AL:al,MC:mc};
  var total=bases[care]+(loc-1)*addon+second+park;
  var el=document.getElementById('locResult');if(el)el.style.display='block';
  var amt=document.getElementById('locResultAmt');if(amt)amt.textContent='$'+total.toLocaleString();
  var note=document.getElementById('locResultNote');if(note)note.textContent=care+' Level '+loc+(second?' + 2nd person':'')+' + $'+(park)+' parking';
  buildLOCTable();
}
function saveLOCRates(){
  LOC_BASE.IL=parseInt(document.getElementById('loc-il').value)||3200;

function saveManualNote(){
  var summary=(document.getElementById('nt-summary')||{}).value.trim();
  if(!summary){T('Summary is required','e');return;}
  var leadSel=document.getElementById('nt-lead');

    var opt=leadSel.options[leadSel.selectedIndex];
    leadName=opt?opt.text:'';

  var type=(document.getElementById('nt-type')||{}).value||'manual';
  var outcome=(document.getElementById('nt-outcome')||{}).value||'';
  var nextStep=(document.getElementById('nt-nextstep')||{}).value||'';
  var followDate=(document.getElementById('nt-followdate')||{}).value||null;

  NOTES.unshift({
    id:++nextId, type:type==='manual'?'manual':'aircall',
    comm_type:type, contact_name:leadName,
    summary:summary, outcome:outcome,
    next_step:nextStep, follow_up_date:followDate,

  ['nt-summary','nt-outcome','nt-nextstep','nt-followdate'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  render('notes');
}

};

var _acTimer=null,_acSecs=0,_acMuted=false;

// ══════════════════════════════════════════════════════════════
// UNIFIED NOTE WRITER (DEMO) — pushes every Aircall activity
// into the in-memory NOTES array so it appears in the Notes tab
// ══════════════════════════════════════════════════════════════
function _addNoteFromAircall(noteData) {
  var TYPE_ICONS  = {call:'📞',text:'💬',email:'✉️',missed_call:'📵',failed_text:'⚠️',failed_email:'⚠️'};
  var TYPE_LABELS = {call:'Phone Call',text:'Text Message',email:'Email',
                     missed_call:'Missed Call',failed_text:'Failed Text',failed_email:'Failed Email'};
  var icon  = TYPE_ICONS[noteData.comm_type]  || '📋';
  var label = TYPE_LABELS[noteData.comm_type] || noteData.comm_type;

  NOTES.unshift({
    id: ++nextId,
    type: 'aircall',
    comm_type: noteData.comm_type,
    contact_name: noteData.contact_name || '',
    summary: icon+' ['+label+'] '+(noteData.contact_name||'')+' — '+(noteData.summary||noteData.outcome||''),
    outcome: noteData.outcome || '',
    next_step: noteData.next_step || '',
    follow_up_date: noteData.follow_up_date || null,
    created_at: new Date().toISOString(),
    user_name: 'Sarah M.',
  });

  T(icon+' Activity logged to Notes tab!');
  // If Notes tab is active, refresh it
  if(ACTIVE==='notes') render('notes');
}

function acDemoInit(){ acDemoChannel('call'); }
function acDemoChannel(ch){
  ['call','text','email'].forEach(function(c){
    var btn=document.getElementById('acBtn-'+c), panel=document.getElementById('acPanel-'+c);
    if(btn) btn.className='ac-ch-btn'+(c===ch?' ac-on':'');
    if(panel) panel.style.display=c===ch?'':'none';
  });
}
function acDemoFillPhone(){ var s=document.getElementById('acCallContact'),p=document.getElementById('acCallPhone'); if(s&&p)p.value=s.value.split('|')[1]||''; }
function acDemoFillTextPhone(){ var s=document.getElementById('acTextContact'),p=document.getElementById('acTextPhone'); if(s&&p)p.value=s.value.split('|')[1]||''; }
function acDemoFillEmail(){ var s=document.getElementById('acEmailContact'),e=document.getElementById('acEmailAddr'); if(s&&e)e.value=s.value.split('|')[1]||''; }
function acDemoTextTpl(sel){ var b=document.getElementById('acTextBody'); if(b&&sel.value){b.value=sel.value;var c=document.getElementById('acTxtCnt');if(c)c.textContent=b.value.length+'/160';} }
function acDemoEmailTpl(sel){
  var t=AC_EMAIL_TPL[sel.value]; if(!t)return;
  var s=document.getElementById('acEmailSubject'),b=document.getElementById('acEmailBody');
  if(s)s.value=t.s; if(b)b.value=t.b;
}
function acDemoStartCall(){
  var phone=(document.getElementById('acCallPhone')||{}).value;
  var sel=document.getElementById('acCallContact');
  var name=sel&&sel.value?sel.value.split('|')[0]:(phone||'Contact');
  if(!phone){T('Enter a phone number first','e');return;}
  T('📞 Connecting to '+name+' via Aircall… (Demo)');
  var w=document.getElementById('acLiveCallWrap'),nm=document.getElementById('acLiveCallName'),ti=document.getElementById('acLiveCallTimer');
  if(w)w.style.display=''; if(nm)nm.textContent=name;
  _acSecs=0;_acMuted=false;
  if(_acTimer)clearInterval(_acTimer);
  _acTimer=setInterval(function(){_acSecs++;var m=Math.floor(_acSecs/60),s=_acSecs%60;if(ti)ti.textContent=m+':'+(s<10?'0':'')+s;},1000);
}
function acDemoEndCall(){
  if(_acTimer)clearInterval(_acTimer);
  var w=document.getElementById('acLiveCallWrap'); if(w)w.style.display='none';
  T('Call ended. Log the outcome below and save to Notes.');
}
function acDemoMute(){
  _acMuted=!_acMuted;
  var btn=document.getElementById('acMuteBtn'); if(btn)btn.textContent=_acMuted?'🔇 Unmute':'🎙 Mute';
  T(_acMuted?'Muted':'Unmuted');
}

// ── Save call → Notes timeline ─────────────────────────────────
function acDemoSaveCall(){
  var outcome=(document.getElementById('acCallOutcome')||{}).value;
  if(!outcome){T('Select an outcome first','e');return;}
  var sel=document.getElementById('acCallContact');
  var name=sel&&sel.value?sel.value.split('|')[0]:'Contact';
  var summary=(document.getElementById('acCallSummary')||{}).value||'';
  var nextStep=(document.getElementById('acCallNext')||{}).value||'';
  var followDate=(document.getElementById('acCallFollowDate')||{}).value||null;
  _addNoteFromAircall({
    comm_type:'call', contact_name:name,
    summary:summary||outcome, outcome:outcome,
    next_step:nextStep, follow_up_date:followDate
  });
  ['acCallOutcome','acCallSummary','acCallNext','acCallFollowDate'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
}

// ── Send text → Notes timeline ──────────────────────────────────
function acDemoSendText(){
  var phone=(document.getElementById('acTextPhone')||{}).value;
  var body=(document.getElementById('acTextBody')||{}).value.trim();
  var sel=document.getElementById('acTextContact');
  var name=sel&&sel.value?sel.value.split('|')[0]:'Contact';
  if(!phone){T('Enter a phone number first','e');return;}
  if(!body){T('Message is required','e');return;}
  _addNoteFromAircall({
    comm_type:'text', contact_name:name,
    summary:'Text sent: '+body.substring(0,120)+(body.length>120?'…':''),
    outcome:'Sent'
  });
  var tb=document.getElementById('acTextBody'); if(tb)tb.value='';
  var cnt=document.getElementById('acTxtCnt'); if(cnt)cnt.textContent='0/160';
}

// ── Send email → Notes timeline ─────────────────────────────────
function acDemoSendEmail(){
  var to=(document.getElementById('acEmailAddr')||{}).value.trim();
  var subject=(document.getElementById('acEmailSubject')||{}).value.trim();
  var body=(document.getElementById('acEmailBody')||{}).value.trim();
  var sel=document.getElementById('acEmailContact');
  var name=sel&&sel.value?sel.value.split('|')[0]:'Contact';
  if(!to){T('Enter recipient email','e');return;}
  if(!subject){T('Subject required','e');return;}
  if(!body){T('Body required','e');return;}
  _addNoteFromAircall({
    comm_type:'email', contact_name:name,
    summary:'Email sent — Subject: '+subject,
    outcome:'Sent'
  });
  ['acEmailAddr','acEmailCC','acEmailSubject','acEmailBody'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
}
