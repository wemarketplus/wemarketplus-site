<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CommunityLink CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#081426;color:#f4f8ff}
.layout{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sb{width:226px;min-width:226px;background:#060f1c;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sb-top{padding:14px 12px 10px;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sb-icon{width:32px;height:32px;background:linear-gradient(135deg,#f59e0b,#ef8c03);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-title{font-size:14px;font-weight:900;letter-spacing:-.01em;color:#f4f8ff}
.sb-product{font-size:10px;color:#f59e0b;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.role-box{background:#0a1628;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.role-lbl{font-size:9px;font-weight:800;color:#4b6278;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.role-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.tenant-name{font-size:11px;font-weight:700;color:#6b7fa3;padding:0 0 8px 0;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:8px}
.sb-scroll{flex:1;overflow-y:auto;padding:0 8px 12px}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:2px}
.nav-sec{display:block;font-size:9px;font-weight:800;color:#2d4a6a;letter-spacing:.12em;text-transform:uppercase;padding:10px 8px 5px}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:none;background:none;color:#7a9abf;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;text-align:left;font-family:inherit;transition:background .12s}
.nav-btn:hover{background:rgba(255,255,255,.04);color:#c8d6e8}
.nav-btn.active{background:rgba(245,158,11,.1);color:#f59e0b;font-weight:700}
.nav-icon{font-size:14px;width:16px;text-align:center;flex-shrink:0}
.sb-bottom{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef8c03);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#06080e;flex-shrink:0}
.sb-uname{font-size:11px;font-weight:700;color:#c8d6e8}
.sb-email{font-size:9px;color:#4b6278}
.sb-logout{display:block;width:100%;padding:7px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.15);color:#f87171;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.sb-logout:hover{background:rgba(248,113,113,.14)}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#060f1c;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.page-title{font-size:16px;font-weight:800;color:#f4f8ff}
.page-sub{font-size:11px;color:#4b6278;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.tb-badge{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#f59e0b;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700}
.content{flex:1;overflow-y:auto;padding:20px}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}

/* Cards */
.card{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:16px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:800;color:#f4f8ff}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px}
.stat-label{font-size:10px;font-weight:700;color:#4b6278;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-val{font-size:28px;font-weight:900;color:#f4f8ff;letter-spacing:-.02em}
.stat-sub{font-size:10px;color:#6b7fa3;margin-top:4px}
.stat-up{color:#4fc87a}

/* Forms & Inputs */
.inp{width:100%;background:#0d1f38;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 12px;font-size:13px;color:#f4f8ff;outline:none;font-family:inherit}
.inp:focus{border-color:#f59e0b}
.inp-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.inp-label{font-size:11px;font-weight:700;color:#6b7fa3;margin-bottom:5px}
.inp-wrap{margin-bottom:12px}
select.inp{cursor:pointer}

/* Buttons */
.btn{padding:8px 16px;border:none;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#06080e}
.btn-blue{background:linear-gradient(135deg,#3d9ee8,#1d7bbf);color:#fff}
.btn-green{background:linear-gradient(135deg,#4fc87a,#22a855);color:#06080e}
.btn-ghost{background:rgba(255,255,255,.06);color:#8ba4c4;border:1px solid rgba(255,255,255,.08)}
.btn-red{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.2)}
.btn-sm{padding:5px 12px;font-size:11px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;color:#4b6278;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.05)}
.tbl td{padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:#c8d6e8;vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}

/* Status badges */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.badge-green{background:rgba(79,200,122,.12);color:#4fc87a}
.badge-amber{background:rgba(245,158,11,.12);color:#f59e0b}
.badge-blue{background:rgba(61,158,232,.12);color:#3d9ee8}
.badge-red{background:rgba(248,113,113,.12);color:#f87171}
.badge-gray{background:rgba(107,127,163,.12);color:#6b7fa3}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;background:#0d1f38;border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:12px 18px;font-size:13px;font-weight:600;color:#f4f8ff;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:#4b6278;font-size:14px}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.1);border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-panel{background:#0d1b31;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative}

@media(max-width:768px){
  .sb{display:none}
  .inp-group{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="layout">

<!-- SIDEBAR -->
<aside class="sb" id="sidebar">
  <div class="sb-top">
    <div class="sb-brand">
      <div class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06080e" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div><div class="sb-title">CommunityLink</div><div class="sb-product">We Market Plus</div></div>
    </div>
    <div class="role-box">
      <div class="role-lbl">Signed in as</div>
      <div class="role-badge" id="sbRoleBadge">Loading…</div>
    </div>
    <div class="tenant-name" id="sbTenantName">Loading community…</div>
  </div>

  <div class="sb-scroll">
    <div id="sideNav"></div>
  </div>

  <div class="sb-bottom">
    <div class="sb-user">
      <div class="sb-avatar" id="sbAvatar">?</div>
      <div>
        <div class="sb-uname" id="sbName">Loading…</div>
        <div class="sb-email" id="sbEmail"></div>
      </div>
    </div>
    <button class="sb-logout" onclick="logout()">Sign Out</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="page-sub" id="pageSub">Loading…</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="tb-badge" id="tierBadge">CL Pro</span>
    </div>
  </div>

  <div class="content" id="mainContent">
    <div class="loading"><div class="spinner"></div>Loading dashboard…</div>
  </div>
</div>
</div>

<div id="toast"></div>

<script>
// ── Config ───────────────────────────────────────────────────────
var BACKEND = 'https://api.wemarketplus.com';
var TOKEN   = localStorage.getItem('cl_token') || localStorage.getItem('hl_token') || '';
var USER    = {};

// ── Auth helper ─────────────────────────────────────────────────
function authFetch(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }, opts.headers || {});
  return fetch(url, opts).then(function(r) {
    if (r.status === 401) { logout(); return Promise.reject(new Error('Unauthorized')); }
    return r;
  });
}

function T(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = type==='e' ? 'rgba(248,113,113,.4)' : 'rgba(245,158,11,.3)';
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function logout() {
  localStorage.removeItem('cl_token');
  localStorage.removeItem('hl_token');
  window.location.href = '../communitylink/login.html';
}

// ── Role-based navigation defs ───────────────────────────────────
var NAV_DEFS = {
  admin: [
    { sec: 'Sales & Outreach', items:[
      {icon:'📊',label:'Dashboard',key:'dashboard'},
      {icon:'👥',label:'Lead Pipeline',key:'leads'},
      {icon:'🏥',label:'Referral Sources',key:'referrals'},
      {icon:'🗓',label:'Tour Scheduler',key:'tours'},
      {icon:'📍',label:'GPS Check-In',key:'gps'},
      {icon:'🚗',label:'Mileage Tracker',key:'mileage'},
      {icon:'📝',label:'Outreach Log',key:'outreach'},
    ]},
    { sec: 'Operations', items:[
      {icon:'🏠',label:'Apartment Inventory',key:'apartments'},
      {icon:'🔧',label:'Make-Ready Board',key:'makeready'},
      {icon:'⚙️',label:'Maintenance',key:'maintenance'},
      {icon:'🧹',label:'Housekeeping',key:'housekeeping'},
    ]},
    { sec: 'Financial', items:[
      {icon:'💰',label:'Financial Ledger',key:'ledger'},
      {icon:'📈',label:'Revenue Leakage',key:'revenue'},
      {icon:'🤝',label:'Concessions',key:'concessions'},
      {icon:'🔢',label:'LOC Pricing',key:'loc'},
      {icon:'🏆',label:'Competitors',key:'competitors'},
    ]},
    { sec: 'Management', items:[
      {icon:'📋',label:'Reports',key:'reports'},
      {icon:'👤',label:'Users & Seats',key:'users'},
      {icon:'⚙️',label:'Settings',key:'settings'},
    ]},
  ],
  marketer: [
    { sec: 'My Work', items:[
      {icon:'📊',label:'Dashboard',key:'dashboard'},
      {icon:'👥',label:'My Leads',key:'leads'},
      {icon:'🏥',label:'Referral Sources',key:'referrals'},
      {icon:'🗓',label:'Tours',key:'tours'},
      {icon:'📍',label:'GPS Check-In',key:'gps'},
      {icon:'🚗',label:'Mileage',key:'mileage'},
      {icon:'📝',label:'Outreach Log',key:'outreach'},
      {icon:'✅',label:'My Tasks',key:'tasks'},
    ]},
  ],
  director: [
    { sec: 'Overview', items:[
      {icon:'📊',label:'Executive Dashboard',key:'dashboard'},
      {icon:'🏠',label:'Occupancy Overview',key:'apartments'},
      {icon:'👥',label:'Lead Pipeline',key:'leads'},
    ]},
    { sec: 'Operations', items:[
      {icon:'🔧',label:'Make-Ready',key:'makeready'},
      {icon:'⚙️',label:'Maintenance',key:'maintenance'},
      {icon:'🧹',label:'Housekeeping',key:'housekeeping'},
    ]},
    { sec: 'Financial', items:[
      {icon:'💰',label:'Financial Ledger',key:'ledger'},
      {icon:'📈',label:'Revenue Leakage',key:'revenue'},
      {icon:'📋',label:'Reports',key:'reports'},
    ]},
  ],
  maintenance: [
    { sec: 'Maintenance', items:[
      {icon:'📊',label:'My Queue',key:'dashboard'},
      {icon:'⚙️',label:'Tickets',key:'maintenance'},
      {icon:'🔧',label:'Make-Ready',key:'makeready'},
    ]},
  ],
  housekeeping: [
    { sec: 'Housekeeping', items:[
      {icon:'📊',label:'My Queue',key:'dashboard'},
      {icon:'🧹',label:'Tasks',key:'housekeeping'},
      {icon:'🔧',label:'Make-Ready',key:'makeready'},
    ]},
  ],
  owner: [
    { sec: 'Investor View', items:[
      {icon:'📊',label:'Portfolio Dashboard',key:'dashboard'},
      {icon:'💰',label:'Financial Ledger',key:'ledger'},
      {icon:'📈',label:'Revenue Leakage',key:'revenue'},
      {icon:'🏆',label:'Competitor Intel',key:'competitors'},
      {icon:'📋',label:'Reports',key:'reports'},
    ]},
  ],
};

var activeSec = 'dashboard';

function buildNav() {
  var role = USER.role || 'marketer';
  var defs = NAV_DEFS[role] || NAV_DEFS.marketer;
  var nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  defs.forEach(function(grp) {
    nav.innerHTML += '<span class="nav-sec">' + grp.sec + '</span>';
    grp.items.forEach(function(item) {
      nav.innerHTML += '<button class="nav-btn' + (activeSec===item.key?' active':'') + '" onclick="showSection(\'' + item.key + '\')">'
        + '<span class="nav-icon">' + item.icon + '</span>' + item.label + '</button>';
    });
  });
}

function showSection(key) {
  activeSec = key;
  buildNav();
  var titles = {
    dashboard:'Dashboard', leads:'Lead Pipeline', referrals:'Referral Sources',
    tours:'Tour Scheduler', gps:'GPS Check-In', mileage:'Mileage Tracker',
    outreach:'Outreach Log', tasks:'My Tasks', apartments:'Apartment Inventory',
    makeready:'Make-Ready Board', maintenance:'Maintenance Tickets',
    housekeeping:'Housekeeping Tasks', ledger:'Financial Ledger',
    revenue:'Revenue Leakage', concessions:'Concession Approvals',
    loc:'LOC Pricing Calculator', competitors:'Competitor Benchmarking',
    reports:'Reports Center', users:'Users & Seats', settings:'Admin Settings',
  };
  document.getElementById('pageTitle').textContent = titles[key] || key;
  document.getElementById('mainContent').innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
  loadPanel(key);
}

// ── Panel loaders (API-backed) ────────────────────────────────────
function loadPanel(key) {
  var handlers = {
    dashboard:   loadDashboard,
    leads:       loadLeads,
    referrals:   loadReferrals,
    apartments:  loadApartments,
    makeready:   loadMakeReady,
    maintenance: loadMaintenance,
    housekeeping:loadHousekeeping,
    tours:       loadTours,
    gps:         loadGPS,
    mileage:     loadMileage,
    outreach:    loadOutreach,
    tasks:       loadTasks,
    ledger:      loadLedger,
    revenue:     loadRevenue,
    concessions: loadConcessions,
    loc:         loadLOC,
    competitors: loadCompetitors,
    reports:     loadReports,
    users:       loadUsers,
    settings:    loadSettings,
  };
  var fn = handlers[key] || function() { renderFallback(key); };
  fn();
}

function renderFallback(key) {
  document.getElementById('mainContent').innerHTML = '<div class="card"><p style="color:#6b7fa3;padding:20px 0">'+key+' module loading…</p></div>';
}

// ── Dashboard ────────────────────────────────────────────────────
function loadDashboard() {
  var tierCl = (USER.crm_tier||'').replace('cl_','');
  authFetch(BACKEND+'/api/cl/dashboard').then(function(r){return r.json();}).then(function(d){
    if(d.error){renderFallback('dashboard');return;}
    var tier = USER.crm_tier||'cl_pro';
    renderDashboard(d, tier);
  }).catch(function(){renderOfflineDashboard();});
}

function renderDashboard(d, tier) {
  var isGold = tier==='cl_gold'||tier==='cl_max';
  var isMax  = tier==='cl_max';
  var role   = USER.role||'marketer';
  var mc = document.getElementById('mainContent');
  var html = '<div class="stat-grid">';
  html += stat('Active Leads', d.active_leads||'—', '');
  html += stat('Tours This Month', d.tours_month||'—', '');
  html += stat('Move-Ins (This Mo)', d.move_ins||'—', '');
  if(isGold) html += stat('Occupancy Rate', (d.occupancy||'—')+'%', '↑ vs last month');
  if(isMax)  html += stat('Monthly Revenue', '$'+(d.revenue||'—'), '');
  html += stat('Open Tasks', d.open_tasks||'—', '');
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
  html += '<div class="card"><div class="card-hd"><div class="card-title">Hot Leads</div><button class="btn btn-amber btn-sm" onclick="showSection(\'leads\')">View All</button></div>';
  html += '<p style="color:#6b7fa3;font-size:12px;padding:8px 0">Loading leads…</p></div>';
  html += '<div class="card"><div class="card-hd"><div class="card-title">Today\'s Tasks</div></div>';
  html += '<p style="color:#6b7fa3;font-size:12px;padding:8px 0">Loading tasks…</p></div>';
  html += '</div>';
  mc.innerHTML = html;
  // Load leads and tasks asynchronously into those placeholders
  loadDashboardLeads();
  loadDashboardTasks();
}

function renderOfflineDashboard() {
  document.getElementById('mainContent').innerHTML = [
    '<div class="stat-grid">',
    stat('Active Leads','—',''),stat('Tours This Month','—',''),
    stat('Move-Ins','—',''),stat('Open Tasks','—',''),
    '</div>',
    '<div class="card"><div class="card-hd"><div class="card-title">Getting started</div></div>',
    '<p style="color:#6b7fa3;font-size:13px">Welcome to CommunityLink. Use the sidebar to navigate to Leads, Apartments, and more.</p></div>'
  ].join('');
}

function stat(label,val,sub){
  return '<div class="stat-card"><div class="stat-label">'+label+'</div><div class="stat-val">'+val+'</div>'+(sub?'<div class="stat-sub">'+sub+'</div>':'')+'</div>';
}

function loadDashboardLeads() {
  authFetch(BACKEND+'/api/cl/leads?urgency=hot&limit=4').then(function(r){return r.json();}).then(function(d){
    var cards = document.querySelectorAll('.card');
    if(!cards[0]) return;
    var html = '<div class="card-hd"><div class="card-title">Hot Leads</div><button class="btn btn-amber btn-sm" onclick="showSection(\'leads\')">View All</button></div>';
    var leads = (d.data||[]).slice(0,4);
    if(!leads.length){html+='<p style="color:#6b7fa3;font-size:12px;padding:8px 0">No hot leads right now.</p>';}
    leads.forEach(function(l){
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)">'
        +'<div><div style="font-size:13px;font-weight:700;color:#f4f8ff">'+escH(l.name)+'</div>'
        +'<div style="font-size:11px;color:#6b7fa3">'+escH(l.care_type||'')+'&bull;'+escH(l.status||'')+'</div></div>'
        +'<button class="btn btn-amber btn-sm" onclick="openLeadDetail(\''+l.id+'\')">View</button></div>';
    });
    cards[0].innerHTML = html;
  }).catch(function(){});
}

function loadDashboardTasks() {
  authFetch(BACKEND+'/api/cl/tasks?status=open&limit=5').then(function(r){return r.json();}).then(function(d){
    var cards = document.querySelectorAll('.card');
    if(!cards[1]) return;
    var html = '<div class="card-hd"><div class="card-title">Today\'s Tasks</div><button class="btn btn-ghost btn-sm" onclick="showSection(\'tasks\')">All Tasks</button></div>';
    var tasks = (d.data||[]).slice(0,5);
    if(!tasks.length){html+='<p style="color:#6b7fa3;font-size:12px;padding:8px 0">No open tasks.</p>';}
    tasks.forEach(function(t){
      html+='<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)">'
        +'<input type="checkbox" onchange="completeTask(\''+t.id+'\',this)" style="accent-color:#f59e0b;flex-shrink:0">'
        +'<div style="flex:1"><div style="font-size:12px;color:#c8d6e8">'+escH(t.title)+'</div>'
        +'<div style="font-size:10px;color:#4b6278">Due '+escH(t.due_date||'')+'</div></div></div>';
    });
    cards[1].innerHTML = html;
  }).catch(function(){});
}

function completeTask(id, cb) {

  el.value='Detecting…';
  navigator.geolocation.getCurrentPosition(function(p){
    el.value=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);
  },function(){el.value='Permission denied';});
}

  var org=document.getElementById('gpsOrg').value.trim();

function calcLOC(){
  var care=document.getElementById('estCare').value;
  var loc=parseInt(document.getElementById('estLOC').value)||1;
  var bases={IL:parseInt(document.getElementById('locIL').value)||3200,AL:parseInt(document.getElementById('locAL').value)||4500,MC:parseInt(document.getElementById('locMC').value)||5800};
  var addon=parseInt(document.getElementById('locAdd').value)||150;
  var total=bases[care]+(loc-1)*addon;
  document.getElementById('locResult').textContent='Estimated Rate: $'+total.toLocaleString()+'/month';
}

  var data={il_base:parseInt(document.getElementById('locIL').value),al_base:parseInt(document.getElementById('locAL').value),mc_base:parseInt(document.getElementById('locMC').value),loc_addon:parseInt(document.getElementById('locAdd').value)};

    html+='<div class="inp-wrap"><div class="inp-label">'+f.label+'</div>';
    if(f.type==='select'){html+='<select class="inp" id="'+f.id+'">'+f.opts.map(function(o){return'<option>'+o+'</option>';}).join('')+'</select>';}
    else if(f.type==='textarea'){html+='<textarea class="inp" id="'+f.id+'" rows="3" placeholder="'+escH(f.ph||'')+'"></textarea>';}
    else{html+='<input class="inp" id="'+f.id+'" type="'+f.type+'" placeholder="'+escH(f.ph||'')+'">';}
    html+='</div>';
  });
  html+='<button class="btn btn-amber" onclick="'+saveFunc+'()">Save</button></div>';
  document.getElementById('mainContent').innerHTML=html;
}

// ── Boot ─────────────────────────────────────────────────────────
function boot() {
  if (!TOKEN) { logout(); return; }
  // Decode JWT to get user info
  try {
    var payload = JSON.parse(atob(TOKEN.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    USER = {
      user_id:  payload.user_id,
      tenant_id: payload.tenant_id,
      email:    payload.email,
      role:     payload.role,
      crm_tier: payload.crm_tier,
      first_name: payload.first_name,
      last_name:  payload.last_name,
    };
  } catch(e) { logout(); return; }

  // Validate this is a CommunityLink account
  var tier = USER.crm_tier || '';
  if (!tier.startsWith('cl_')) {
    // Might be using hl_ token — redirect to HL CRM
    window.location.href = '../login.html';
    return;
  }

  // Update sidebar UI
  var roleLabelMap = {admin:'Administrator',marketer:'Sales Marketer',director:'Executive Director',maintenance:'Maintenance',housekeeping:'Housekeeping',owner:'Owner/Investor'};
  document.getElementById('sbRoleBadge').textContent = roleLabelMap[USER.role] || USER.role;
  document.getElementById('sbName').textContent = (USER.first_name||'') + ' ' + (USER.last_name||'');
  document.getElementById('sbEmail').textContent = USER.email || '';
  var initials = ((USER.first_name||'?')[0] + (USER.last_name||'?')[0]).toUpperCase();
  document.getElementById('sbAvatar').textContent = initials;

  // Tier badge
  var tierLabels = {cl_pro:'CL Pro',cl_gold:'CL Gold',cl_max:'CL Max'};
  document.getElementById('tierBadge').textContent = tierLabels[tier] || tier;

  // Load community name
  authFetch(BACKEND+'/api/cl/dashboard').then(function(r){return r.json();}).then(function(d){
    document.getElementById('sbTenantName').textContent = d.community_name || 'My Community';
    document.getElementById('pageSub').textContent = (d.community_name||'My Community') + ' — ' + new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'});
    USER.community_name = d.community_name;
  }).catch(function(){
    document.getElementById('sbTenantName').textContent = 'My Community';
    document.getElementById('pageSub').textContent = new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'});
  });

  buildNav();
  showSection('dashboard');
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
