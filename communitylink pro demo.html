<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CommunityLink Pro CRM Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#07111e;color:#f4f8ff}
.layout{display:flex;height:100vh;overflow:hidden}
.sb{width:224px;min-width:224px;background:#060e1b;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sb-top{padding:14px 12px 10px;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sb-icon{width:30px;height:30px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-title{font-size:13px;font-weight:900;color:#f4f8ff}
.sb-tier{font-size:9px;color:#f59e0b;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.demo-badge{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:6px 10px;font-size:11px;color:#f59e0b;font-weight:700;text-align:center;margin-bottom:8px}
.role-box{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.12);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.role-lbl{font-size:9px;font-weight:800;color:#4b6278;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.role-sel{width:100%;background:#0a1628;border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;color:#f0f5ff;outline:none;cursor:pointer;font-family:inherit}
.role-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10px;font-weight:800;margin-top:5px;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.sb-nav{flex:1;overflow-y:auto;padding:0 8px 8px}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
.nav-sec{display:block;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#1e3a5f;padding:10px 6px 3px}
.nb{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:#7a9abf;background:transparent;border:none;font-family:inherit;transition:background .1s,color .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb:hover{background:rgba(255,255,255,.06);color:#c8d6e8}
.nb.on{background:rgba(245,158,11,.12);color:#f59e0b;font-weight:800}
.sb-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;font-size:10px;color:#2c4460;text-align:center}
.sb-foot a{color:#f59e0b;text-decoration:none}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:#060e1b;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.page-title{font-size:15px;font-weight:800;color:#f4f8ff}
.page-sub{font-size:11px;color:#4b6278}
.tb-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#06080e;border:none;border-radius:999px;padding:7px 18px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.content{flex:1;overflow-y:auto;padding:20px}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
.tab{display:none}.tab.on{display:block}
.card{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:14px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-t{font-size:13px;font-weight:800;color:#f4f8ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#0a1628;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:rgba(245,158,11,.3)}
.sl{font-size:10px;font-weight:700;color:#4b6278;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sv{font-size:26px;font-weight:900;color:#f4f8ff}
.ss{font-size:10px;color:#6b7fa3;margin-top:3px}
.sg{color:#4fc87a}.sr{color:#f87171}.sa{color:#f59e0b}
.fi{background:#0d1f38;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 11px;font-size:13px;color:#f4f8ff;font-family:inherit;outline:none;width:100%}
.fi:focus{border-color:#f59e0b}
select.fi{cursor:pointer}
textarea.fi{resize:vertical;min-height:72px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fl{display:flex;flex-direction:column;gap:4px}
.flb{font-size:11px;font-weight:700;color:#4b6278}
.fw{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;font-size:10px;font-weight:800;color:#1e3a5f;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.05)}
.tbl td{padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:#c8d6e8;vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.bg{background:rgba(79,200,122,.1);color:#4fc87a}
.ba{background:rgba(245,158,11,.1);color:#f59e0b}
.bb{background:rgba(61,158,232,.1);color:#3d9ee8}
.br{background:rgba(248,113,113,.1);color:#f87171}
.bx{background:rgba(255,255,255,.07);color:#8ba4c4}
.btn{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn-a{background:linear-gradient(135deg,#f59e0b,#d97706);color:#06080e}
.btn-g{background:linear-gradient(135deg,#4fc87a,#22a855);color:#06080e}
.btn-x{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#8ba4c4}
.btn-r{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:#f87171}
.btn-sm{padding:5px 11px;font-size:11px}
.pbar{height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:6px 0}
.pbar-f{height:100%;background:#f59e0b;border-radius:99px;transition:width .4s}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-panel{background:#0d1b31;border:1px solid rgba(245,158,11,.2);border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:#6b7fa3;font-size:20px;cursor:pointer;line-height:1}
#toast{position:fixed;bottom:20px;right:20px;background:#0d1b31;border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;color:#f4f8ff;z-index:99999;opacity:0;transform:translateY(8px);transition:all .22s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.err{border-color:rgba(248,113,113,.4);background:#1a0d0d}
.ai-msgs{height:260px;overflow-y:auto;background:#060e1b;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.ai-m{max-width:80%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.5}
.ai-u{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#f4f8ff;align-self:flex-end}
.ai-a{background:#0d1b31;border:1px solid rgba(255,255,255,.08);color:#c8d6e8;align-self:flex-start}
.ai-thinking{color:#4b6278;font-style:italic}
.gps-map{background:#060e1b;border:1px solid rgba(245,158,11,.12);border-radius:12px;height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.gps-dot{width:14px;height:14px;background:#f59e0b;border-radius:50%;box-shadow:0 0 0 4px rgba(245,158,11,.25);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(245,158,11,.25)}50%{box-shadow:0 0 0 12px rgba(245,158,11,.04)}}
.upgrade-box{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:14px;padding:32px;text-align:center}
</style>
</head>
<body>
<div class="layout">
<aside class="sb">
  <div class="sb-top">
    <div class="sb-brand">
      <div class="sb-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#06080e" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>

</div>

<div class="modal-bg" id="leadModal">

</div>
<div class="modal-bg" id="taskModal">

</div>
<div id="toast"></div>

<script>
// ─── DATA ──────────────────────────────────────────────────────────
var LEADS = [
  {id:1,name:'Dorothy Harrison',age:82,care:'Independent Living',status:'Tour Scheduled',source:'Physician Referral',urgency:'Hot',phone:'(214) 555-0142',notes:'Family meeting needed. Son James is POA.',fu:'2026-02-14'},
  {id:2,name:'Walter Simmons',age:78,care:'Assisted Living',status:'Inquiry',source:'Website',urgency:'Warm',phone:'(972) 555-0278',notes:'Looking for 2BR. Wife passed last month.',fu:'2026-02-16'},
  {id:3,name:'Gloria Tran',age:86,care:'Memory Care',status:'Proposal Sent',source:'Hospital Discharge',urgency:'Hot',phone:'(469) 555-0391',notes:'MNSD diagnosis. Daughter wants quick move-in.',fu:'2026-02-13'},
  {id:4,name:'Raymond Flores',age:74,care:'Independent Living',status:'Follow-up',source:'Community Event',urgency:'Cold',phone:'(817) 555-0456',notes:'Not ready yet. Call back in March.',fu:'2026-03-05'},
  {id:5,name:'Edna Michaels',age:80,care:'Assisted Living',status:'Tour Scheduled',source:'Google',urgency:'Warm',phone:'(214) 555-0567',notes:'Has VA benefits. Confirm eligibility.',fu:'2026-02-15'},
  {id:6,name:'James Owens',age:88,care:'Memory Care',status:'Move-In',source:'Physician Referral',urgency:'',phone:'(972) 555-0678',notes:'Moved in Jan 28. Very smooth transition.',fu:''},
  {id:7,name:'Ruth Patterson',age:76,care:'Independent Living',status:'Inquiry',source:'Word of Mouth',urgency:'Warm',phone:'(214) 555-0789',notes:'Daughter called. Mom is on waiting list elsewhere.',fu:'2026-02-20'},

var REFERRALS = [
  {id:1,name:'Dr. Amanda Chen',type:'Physician',org:'Dallas Medical Group',phone:'(214) 555-1001',leads:8,last:'2026-02-10'},
  {id:2,name:'Sarah Kim RN',type:'Hospital',org:'Parkland Hospital',phone:'(214) 555-1002',leads:5,last:'2026-02-08'},
  {id:3,name:'Tom Walsh SW',type:'Social Worker',org:'Methodist Senior Care',phone:'(972) 555-1003',leads:3,last:'2026-01-30'},
  {id:4,name:'Riverside Rehab',type:'Rehab / SNF',org:'Riverside PT & Rehab',phone:'(469) 555-1004',leads:6,last:'2026-02-11'},
  {id:5,name:'Grace Liu',type:'Community',org:'Senior Activity Center',phone:'(817) 555-1005',leads:2,last:'2026-01-25'},
];

var TASKS = [
  {id:1,title:'Call Dorothy Harrison — tour confirmation',due:'2026-02-13',priority:'High',done:false,assignee:'Sarah M.'},
  {id:2,title:'Send Gloria Tran proposal follow-up',due:'2026-02-13',priority:'High',done:false,assignee:'Sarah M.'},
  {id:3,title:'Submit mileage for week of Feb 10',due:'2026-02-14',priority:'Med',done:false,assignee:'James K.'},
  {id:4,title:'Schedule Edna Michaels tour',due:'2026-02-15',priority:'High',done:false,assignee:'Maria L.'},
  {id:5,title:'Riverside Rehab thank-you gift drop-off',due:'2026-02-12',priority:'Low',done:true,assignee:'James K.'},
];

var TOURS = [
  {id:1,name:'Dorothy Harrison',care:'IL',date:'2026-02-14',time:'10:00 AM',guide:'Sarah M.',status:'Confirmed'},
  {id:2,name:'Edna Michaels',care:'AL',date:'2026-02-15',time:'2:00 PM',guide:'Sarah M.',status:'Confirmed'},
  {id:3,name:'Ruth Patterson',care:'IL',date:'2026-02-17',time:'11:00 AM',guide:'TBD',status:'Pending'},
];

var OUTREACH = [
  {id:1,date:'2026-02-11',location:'Parkland Hospital',contact:'Sarah Kim RN',type:'Hospital Visit',miles:12,notes:'Left brochures. Follow-up needed.'},
  {id:2,date:'2026-02-10',location:'Dallas Medical Group',contact:'Dr. Amanda Chen',type:'Physician Visit',miles:8,notes:'Discussed 2 potential patients.'},
  {id:3,date:'2026-02-09',location:'Riverside PT',contact:'Tom Walsh',type:'Referral Visit',miles:15,notes:'Lunch meeting. Building relationship.'},
  {id:4,date:'2026-02-07',location:'Senior Activity Center',contact:'Events Coordinator',type:'Community Event',miles:6,notes:'Distributed flyers. 3 follow-up inquiries.'},
];

var MILEAGE = [
  {id:1,date:'2026-02-11',from:'Sunrise Senior Living',to:'Parkland Hospital',miles:12,purpose:'Hospital Outreach'},
  {id:2,date:'2026-02-10',from:'Sunrise Senior Living',to:'Dallas Medical Group',miles:8,purpose:'Physician Visit'},
  {id:3,date:'2026-02-09',from:'Sunrise Senior Living',to:'Riverside PT',miles:15,purpose:'Referral Lunch'},
  {id:4,date:'2026-02-07',from:'Sunrise Senior Living',to:'Senior Activity Center',miles:6,purpose:'Community Event'},
];

var NOTES = [
  {id:1,leadId:1,contact:'Phone Call',summary:'Spoke with son James. Dorothy recovering from hip replacement. Very warm.',next:'Tour confirmation call Feb 13',date:'2026-02-11'},
  {id:2,leadId:3,contact:'Family Meeting',summary:'Met with daughter Lisa and son Kevin. Memory care diagnosis confirmed.',next:'HOT — decision expected this week',date:'2026-02-10'},
];

var ROLE = 'admin';
var ACTIVE = 'dashboard';
var aiHistory = [];
var nextId = 100;

// ─── ROLE NAV ──────────────────────────────────────────────────────
var NAV = {
  admin:[
    {sec:'MAIN',items:[{k:'dashboard',l:'Dashboard'},{k:'addlead',l:'Add Lead'},{k:'leads',l:'Lead Pipeline'},{k:'refs',l:'Referral Sources'},{k:'addref',l:'Add Referral Source'}]},
    {sec:'OUTREACH',items:[{k:'tours',l:'Tour Scheduler'},{k:'gps',l:'GPS Check-In'},{k:'mileage',l:'Mileage Tracker'},{k:'outreach',l:'Outreach Log'}]},
    {sec:'TOOLS',items:[{k:'tasks',l:'Task Manager'},{k:'notes',l:'Activity Notes'},{k:'ai',l:'AI Sales Assistant'},{k:'reports',l:'Reports Center'},{k:'settings',l:'Settings'}]},
  ],
  marketer:[
    {sec:'MY WORK',items:[{k:'dashboard',l:'My Dashboard'},{k:'addlead',l:'Add Lead'},{k:'leads',l:'My Leads'},{k:'tours',l:'Tours'},{k:'gps',l:'GPS Check-In'},{k:'mileage',l:'Mileage'},{k:'tasks',l:'My Tasks'},{k:'notes',l:'Notes'},{k:'ai',l:'AI Assistant'}]},
    {sec:'SOURCES',items:[{k:'refs',l:'Referral Sources'},{k:'outreach',l:'Outreach Log'}]},
  ],
};

function buildNav() {
  var nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  (NAV[ROLE]||NAV.admin).forEach(function(grp) {
    nav.innerHTML += '<span class="nav-sec">' + grp.sec + '</span>';
    grp.items.forEach(function(item) {
      nav.innerHTML += '<button class="nb' + (ACTIVE===item.k?' on':'') + '" onclick="go(\'' + item.k + '\')">' + item.l + '</button>';
    });
  });
}

function go(key) {
  ACTIVE = key;
  buildNav();
  var titles = {dashboard:'Sales Dashboard',addlead:'Add New Lead',leads:'Lead Pipeline',refs:'Referral Sources',addref:'Add Referral Source',tours:'Tour Scheduler',gps:'GPS Check-In',mileage:'Mileage Tracker',outreach:'Outreach Log',tasks:'Task Manager',notes:'Activity Notes',ai:'AI Sales Assistant',reports:'Reports Center',settings:'Settings'};
  document.getElementById('pageTitle').textContent = titles[key] || key;
  render(key);
}

function changeRole(role) {
  ROLE = role;
  var labels = {admin:'Administrator',marketer:'Sales Marketer'};
  document.getElementById('roleBadge').textContent = labels[role] || role;
  var allowed = (NAV[role]||NAV.admin).flatMap(function(g){return g.items.map(function(i){return i.k;});});
  if (!allowed.includes(ACTIVE)) ACTIVE = 'dashboard';
  buildNav();
  render(ACTIVE);
}

// ─── RENDER ROUTER ─────────────────────────────────────────────────
function render(key) {
  var mc = document.getElementById('mainContent');
  var fns = {dashboard:rDash,addlead:rAddLead,leads:rLeads,refs:rRefs,addref:rAddRef,tours:rTours,gps:rGPS,mileage:rMileage,outreach:rOutreach,tasks:rTasks,notes:rNotes,ai:rAI,reports:rReports,settings:rSettings};
  if (fns[key]) mc.innerHTML = fns[key]();
  else mc.innerHTML = '<div class="card"><p style="color:#6b7fa3;padding:20px">Loading ' + key + '…</p></div>';
}

// ─── HELPERS ───────────────────────────────────────────────────────
function h(s) { if(!s&&s!==0)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cap(s) { if(!s)return''; return s.charAt(0).toUpperCase()+s.slice(1); }
function T(msg,type) { var t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type==='e'?' err':''); setTimeout(function(){t.className='';},3000); }
function openModal(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
function urgBadge(u) { return u==='Hot'?'br':u==='Warm'?'ba':'bb'; }
function statusBadge(s) { return s==='Move-In'?'bg':s==='Tour Scheduled'?'bb':s==='Proposal Sent'?'ba':s==='Lost'?'br':'bx'; }
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal('leadModal');closeModal('taskModal');}});

// ─── DASHBOARD ─────────────────────────────────────────────────────
function rDash() {
  var active=LEADS.filter(function(l){return l.status!=='Move-In'&&l.status!=='Lost';}).length;
  var hot=LEADS.filter(function(l){return l.urgency==='Hot';}).length;
  var tours=TOURS.filter(function(t){return t.status==='Confirmed';}).length;
  var moveins=LEADS.filter(function(l){return l.status==='Move-In';}).length;
  var miles=MILEAGE.reduce(function(s,m){return s+m.miles;},0);
  var openTasks=TASKS.filter(function(t){return !t.done;}).length;

  var stages=['Inquiry','Follow-up','Tour Scheduled','Proposal Sent','Decision Pending','Move-In'];
  var stageColors={'Inquiry':'#3d9ee8','Follow-up':'#a78bfa','Tour Scheduled':'#f59e0b','Proposal Sent':'#f87171','Decision Pending':'#ec4899','Move-In':'#4fc87a'};
  var stageCounts = {};
  stages.forEach(function(s){stageCounts[s]=LEADS.filter(function(l){return l.status===s;}).length;});

  var html = '<div class="stats">'
    + '<div class="stat" onclick="go(\'leads\')" title="View leads"><div class="sl">Active Leads</div><div class="sv">'+active+'</div><div class="ss">In pipeline</div></div>'
    + '<div class="stat" onclick="go(\'tours\')" title="View tours"><div class="sl">Tours Confirmed</div><div class="sv">'+tours+'</div><div class="ss sg">Goal: 12/mo</div></div>'
    + '<div class="stat"><div class="sl">Move-Ins (Feb)</div><div class="sv">'+moveins+'</div><div class="ss" style="color:#8ba4c4">Goal: 4</div></div>'
    + '<div class="stat" onclick="go(\'refs\')" title="View referrals"><div class="sl">Referral Sources</div><div class="sv">'+REFERRALS.length+'</div><div class="ss sg">Active partners</div></div>'
    + '<div class="stat" onclick="go(\'mileage\')" title="View mileage"><div class="sl">Miles (MTD)</div><div class="sv">'+miles+'</div><div class="ss">$'+(miles*0.67).toFixed(0)+' reimbursable</div></div>'
    + '<div class="stat" onclick="go(\'tasks\')" title="View tasks"><div class="sl">Open Tasks</div><div class="sv sr">'+openTasks+'</div><div class="ss sr">Need attention</div></div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">'

  return leads.map(function(l) {

      +'<td><span class="badge '+urgBadge(l.urgency)+'">'+(l.urgency||'—')+'</span></td>'
      +'<td style="font-size:11px">'+h(l.source)+'</td>'

function filterLeads() {
  var q=(document.getElementById('leadSearch')||{value:''}).value.toLowerCase();
  var st=(document.getElementById('leadStatus')||{value:''}).value;
  var ug=(document.getElementById('leadUrg')||{value:''}).value;
  var filtered=LEADS.filter(function(l){
    return (!q||(l.name+l.care+l.status+l.source).toLowerCase().includes(q))&&(!st||l.status===st)&&(!ug||l.urgency===ug);

function captureGPS() {
  var el=document.getElementById('gpsCoords');
  var disp=document.getElementById('gpsCoordDisplay');
  if(!navigator.geolocation){if(el)el.value='GPS not available';return;}
  if(el)el.value='Detecting…';
  navigator.geolocation.getCurrentPosition(function(p){
    var c=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);
    if(el)el.value=c;
    if(disp)disp.textContent=c;
    T('GPS captured!');
  },function(){if(el)el.value='Permission denied';});
}

function logGPS() {
  var org=(document.getElementById('gpsOrg')||{value:''}).value.trim();
  if(!org){T('Facility name required.','e');return;}
  var miles=parseFloat((document.getElementById('gpsMiles')||{value:0}).value)||0;
  var entry={id:++nextId,date:new Date().toISOString().split('T')[0],location:org,contact:(document.getElementById('gpsPerson')||{value:''}).value,type:(document.getElementById('gpsType')||{value:'Visit'}).value,miles:miles,notes:(document.getElementById('gpsNotes')||{value:''}).value};
  OUTREACH.unshift(entry);
  if(miles>0) MILEAGE.unshift({id:++nextId,date:entry.date,from:'Sunrise Senior Living',to:org,miles:miles,purpose:entry.type});
  T('✓ Check-in logged: ' + org);
  go('gps');
}

    +'<table class="tbl"><thead><tr><th>Date</th><th>From</th><th>To</th><th>Miles</th><th>Purpose</th><th>Reimbursable</th><th></th></tr></thead><tbody>'
    +MILEAGE.map(function(m){return'<tr><td>'+h(m.date)+'</td><td style="font-size:11px">'+h(m.from)+'</td><td style="font-size:11px">'+h(m.to)+'</td><td style="font-weight:700;color:#f4f8ff">'+m.miles+'</td><td style="font-size:11px">'+h(m.purpose)+'</td><td class="sg">$'+(m.miles*0.67).toFixed(2)+'</td><td><button class="btn btn-r btn-sm" onclick="deleteMileage('+m.id+')">✕</button></td></tr>';}).join('')
    +'</tbody></table></div>';
}

function saveMileage() {
  var miles=parseFloat((document.getElementById('mlm')||{value:0}).value);
  var date=(document.getElementById('mld')||{value:''}).value;
  if(!miles||!date){T('Miles and date required.','e');return;}
  MILEAGE.unshift({id:++nextId,date:date,from:(document.getElementById('mlf')||{value:''}).value||'Sunrise SL',to:(document.getElementById('mlt')||{value:''}).value,miles:miles,purpose:(document.getElementById('mlpur')||{value:'Visit'}).value});
  T(miles + ' miles logged — $' + (miles*0.67).toFixed(2) + ' reimbursable!');
  render('mileage');
}

function deleteMileage(id){MILEAGE=MILEAGE.filter(function(m){return m.id!==id;});T('Entry removed.');render('mileage');}

function exportMileage() {
  var rows=['Date,From,To,Miles,Purpose,Reimbursable'].concat(MILEAGE.map(function(m){return[m.date,m.from,m.to,m.miles,m.purpose,'$'+(m.miles*0.67).toFixed(2)].join(',');}));
  var blob=new Blob([rows.join('\n')],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mileage-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
  T('Mileage CSV exported!');
}

// ─── TASK MANAGER ──────────────────────────────────────────────────
function rTasks() {
  var open=TASKS.filter(function(t){return !t.done;});
  var done=TASKS.filter(function(t){return t.done;});
  return '<div class="card"><div class="card-hd"><div class="card-t">Task Manager</div><button class="btn btn-a btn-sm" onclick="showTaskForm()">+ Add Task</button></div>'
    +'<div id="taskFormArea"></div>'
    +'<div style="margin-bottom:10px"><span class="badge br" style="margin-right:6px">'+open.length+' open</span><span class="badge bg">'+done.length+' complete</span></div>'
    +TASKS.map(function(t){
      return '<div style="display:flex;gap:11px;align-items:center;background:#071120;border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:11px 13px;margin-bottom:7px'+(t.done?';opacity:.5':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask('+t.id+',this)" style="accent-color:#f59e0b;width:14px;height:14px;flex-shrink:0">'
        +'<div style="flex:1"><div style="font-size:13px;color:#f4f8ff;'+(t.done?'text-decoration:line-through':'')+'">'+h(t.title)+'</div>'
        +'<div style="font-size:10px;color:#4b6278;margin-top:2px">Due '+h(t.due)+' &bull; <span style="color:'+(t.priority==='High'?'#f87171':t.priority==='Med'?'#f59e0b':'#4fc87a')+'">'+h(t.priority)+'</span> &bull; '+h(t.assignee)+'</div></div>'
        +(ROLE==='admin'?'<button class="btn btn-r btn-sm" onclick="deleteTask('+t.id+')">✕</button>':'')
        +'</div>';
    }).join('')+'</div>';
}

function showTaskForm() {
  var area=document.getElementById('taskFormArea');
  if(!area) return;
  area.innerHTML='<div style="background:#071120;border:1px solid rgba(245,158,11,.15);border-radius:10px;padding:14px;margin-bottom:14px">'
    +'<div class="fg"><div class="fl fw"><div class="flb">Task Title *</div><input class="fi" id="tskTitle" placeholder="Follow up with Dorothy Harrison"></div>'
    +'<div class="fl"><div class="flb">Due Date</div><input class="fi" type="date" id="tskDue"></div>'
    +'<div class="fl"><div class="flb">Priority</div><select class="fi" id="tskPri"><option value="High">High</option><option value="Med" selected>Medium</option><option value="Low">Low</option></select></div>'
    +'<div class="fl fw"><div class="flb">Assignee</div><input class="fi" id="tskAssign" placeholder="Sarah M."></div>'
    +'</div><div style="display:flex;gap:8px"><button class="btn btn-a btn-sm" onclick="saveTask()">Add Task</button><button class="btn btn-x btn-sm" onclick="document.getElementById(\'taskFormArea\').innerHTML=\'\'">Cancel</button></div></div>';
}

function saveTask() {
  var title=(document.getElementById('tskTitle')||{value:''}).value.trim();
  if(!title){T('Title required.','e');return;}
  TASKS.unshift({id:++nextId,title:title,due:(document.getElementById('tskDue')||{value:'TBD'}).value||'TBD',priority:(document.getElementById('tskPri')||{value:'Med'}).value,done:false,assignee:(document.getElementById('tskAssign')||{value:'—'}).value||'—'});
  T('Task added: ' + title);
  go('tasks');
}

function toggleTask(id,cb) {
  var t=TASKS.find(function(x){return x.id===id;});
  if(!t) return;
  t.done=cb.checked;
  T(t.done?'Task completed!':'Task reopened.');
  render('tasks');
}

function deleteTask(id){TASKS=TASKS.filter(function(t){return t.id!==id;});T('Task removed.');render('tasks');}

// ─── NOTES ─────────────────────────────────────────────────────────
function rNotes() {
  return '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:14px">'
    +'<div class="card"><div class="card-hd"><div class="card-t">Log Note</div></div>'
    +'<div class="fl" style="margin-bottom:10px"><div class="flb">Lead / Prospect</div><select class="fi" id="ntLead"><option value="">— General Note —</option>'+LEADS.map(function(l){return'<option value="'+l.id+'">'+h(l.name)+'</option>';}).join('')+'</select></div>'
    +'<div class="fl" style="margin-bottom:10px"><div class="flb">Contact Type</div><select class="fi" id="ntType"><option>Phone Call</option><option>In-Person Visit</option><option>Email</option><option>Text / SMS</option><option>Tour</option><option>Family Meeting</option></select></div>'

    }).join('')+'</div></div></div>';
}

function saveNote() {
  var summary=(document.getElementById('ntSummary')||{value:''}).value.trim();
  if(!summary){T('Summary required.','e');return;}
  var leadId=parseInt((document.getElementById('ntLead')||{value:''}).value)||null;
  NOTES.unshift({id:++nextId,leadId:leadId,contact:(document.getElementById('ntType')||{value:'Call'}).value,summary:summary,next:(document.getElementById('ntNext')||{value:''}).value,date:new Date().toISOString().split('T')[0]});
  T('Note saved!');

// ─── AI ASSISTANT ──────────────────────────────────────────────────
function rAI() {
  return '<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px">'
    +'<div class="card"><div class="card-hd"><div class="card-t">AI Sales Assistant</div><button class="btn btn-x btn-sm" onclick="clearAI()">Clear</button></div>'
    +'<div class="ai-msgs" id="aiMsgs"><div class="ai-m ai-a">Hi! I\'m your CommunityLink AI Sales Assistant. Ask me anything about senior living sales, objection handling, tour scripts, or referral strategies.</div></div>'
    +'<div style="display:flex;gap:8px;margin-top:10px"><input class="fi" id="aiInput" placeholder="Ask anything about senior living sales…" style="flex:1" onkeydown="if(event.key===\'Enter\')sendAI()"><button class="btn btn-a" onclick="sendAI()">Send</button></div></div>'
    +'<div><div class="card"><div class="card-t" style="margin-bottom:10px">Quick Prompts</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px">'
    +['Give me a tour follow-up script for a warm IL prospect','How do I handle: "We need more time to decide"?','Write a re-engagement email for a cold lead','5 talking points for a physician lunch-and-learn','What questions to ask on an initial inquiry call?','Help me write a thank-you note after a tour'].map(function(p){return'<button class="btn btn-x" style="text-align:left;font-size:11px" onclick="askAI(\''+p.replace(/'/g,"\\x27")+'\')">'+p+'</button>';}).join('')
    +'</div></div></div></div>';
}

function clearAI(){aiHistory=[];var el=document.getElementById('aiMsgs');if(el)el.innerHTML='<div class="ai-m ai-a">Chat cleared. How can I help?</div>';}
function askAI(p){var el=document.getElementById('aiInput');if(el){el.value=p;sendAI();}}

async function sendAI() {
  var input=document.getElementById('aiInput');
  var msg=(input||{value:''}).value.trim();
  if(!msg) return;
  if(input) input.value='';
  var msgs=document.getElementById('aiMsgs');
  if(!msgs) return;

  var uDiv=document.createElement('div');
  uDiv.className='ai-m ai-u';uDiv.textContent=msg;msgs.appendChild(uDiv);

  var thinking=document.createElement('div');
  thinking.className='ai-m ai-a ai-thinking';thinking.textContent='Thinking…';msgs.appendChild(thinking);
  msgs.scrollTop=msgs.scrollHeight;

  aiHistory.push({role:'user',content:msg});
  try {
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are an AI sales assistant for CommunityLink CRM, a senior living sales platform. Help sales directors and marketers at independent living, assisted living, and memory care communities. Be specific, practical, and concise. Focus on: tour follow-ups, family dynamics, objection handling, referral relationship building, and occupancy goals.',messages:aiHistory.slice(-10)})});
    var d=await r.json();
    var reply=(d.content&&d.content[0]&&d.content[0].text)||d.error||'No response.';
    aiHistory.push({role:'assistant',content:reply});
    thinking.remove();
    var aDiv=document.createElement('div');aDiv.className='ai-m ai-a';aDiv.textContent=reply;msgs.appendChild(aDiv);
  } catch(e){thinking.textContent='AI unavailable — check connection.';thinking.style.color='#f87171';}
  msgs.scrollTop=msgs.scrollHeight;
}

// ─── REPORTS ───────────────────────────────────────────────────────
function rReports() {
  var active=LEADS.filter(function(l){return l.status!=='Move-In'&&l.status!=='Lost';}).length;
  var moveins=LEADS.filter(function(l){return l.status==='Move-In';}).length;
  var tours=TOURS.length;
  var miles=MILEAGE.reduce(function(s,m){return s+m.miles;},0);
  var conv=tours?Math.round(moveins/tours*100):0;

  return '<div class="stats"><div class="stat"><div class="sl">Active Leads</div><div class="sv">'+active+'</div></div><div class="stat"><div class="sl">Tours</div><div class="sv">'+tours+'</div></div><div class="stat"><div class="sl">Move-Ins</div><div class="sv sg">'+moveins+'</div></div><div class="stat"><div class="sl">Tour→Move-In</div><div class="sv">'+conv+'%</div><div class="ss">Industry avg: 30%</div></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'
    +'<div class="card"><div class="card-hd"><div class="card-t">Leads by Source</div></div>'
    +buildSourceChart()+'</div>'
    +'<div class="card"><div class="card-hd"><div class="card-t">Pipeline Snapshot</div><button class="btn btn-a btn-sm" onclick="exportReport()">Export CSV</button></div>'
    +'<table class="tbl"><thead><tr><th>Stage</th><th>Count</th><th>%</th></tr></thead><tbody>'
    +['Inquiry','Follow-up','Tour Scheduled','Proposal Sent','Move-In'].map(function(s){var c=LEADS.filter(function(l){return l.status===s;}).length;return'<tr><td>'+s+'</td><td style="font-weight:700;color:#f4f8ff">'+c+'</td><td style="color:#6b7fa3">'+(LEADS.length?Math.round(c/LEADS.length*100):0)+'%</td></tr>';}).join('')
    +'</tbody></table></div></div>';
}

function buildSourceChart() {
  var sources={};
  LEADS.forEach(function(l){sources[l.source]=(sources[l.source]||0)+1;});
  var sorted=Object.entries(sources).sort(function(a,b){return b[1]-a[1];});
  var max=sorted[0]?sorted[0][1]:1;
  var colors=['#f59e0b','#3d9ee8','#4fc87a','#a78bfa','#f87171'];
  return sorted.slice(0,5).map(function(e,i){
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><div style="flex:1;font-size:12px;color:#c8d6e8">'+h(e[0])+'</div><div style="width:90px;height:5px;background:#071120;border-radius:3px;overflow:hidden"><div style="height:100%;background:'+colors[i]+';width:'+(e[1]/max*100)+'%"></div></div><div style="font-size:12px;font-weight:700;color:'+colors[i]+';width:18px;text-align:right">'+e[1]+'</div></div>';
  }).join('');
}

function exportReport() {
  var rows=['Name,Care Level,Status,Urgency,Source,Follow-Up'].concat(LEADS.map(function(l){return[l.name,l.care,l.status,l.urgency,l.source,l.fu].join(',')}));
  var blob=new Blob([rows.join('\n')],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leads-report-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
  T('Report exported!');
}
