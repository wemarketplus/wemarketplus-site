<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CommunityLink — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#081426;color:#f4f8ff}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:28px}
.logo-mark{font-size:28px;font-weight:900;color:#49b6ff;letter-spacing:-1px}
.logo-mark span{color:#f59e0b}
.logo-sub{font-size:12px;color:#6b7fa3;margin-top:4px;letter-spacing:.05em}
.card{background:#0d1b31;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:32px 28px}
.card-title{font-size:18px;font-weight:800;margin-bottom:6px}
.card-sub{font-size:13px;color:#6b7fa3;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:#8b9fc4;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.field input{width:100%;background:#0a1628;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px 14px;font-size:14px;color:#f4f8ff;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:#f59e0b}
.field input::placeholder{color:#3a4d6b}
.forgot{text-align:right;margin-top:6px}
.forgot a{font-size:12px;color:#49b6ff;text-decoration:none}
.btn-login{width:100%;background:#f59e0b;color:#06080e;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s}
.btn-login:hover{opacity:.88}
.divider{text-align:center;font-size:12px;color:#3a4d6b;margin:18px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:rgba(255,255,255,.07)}
.divider::before{left:0}.divider::after{right:0}
.msg{text-align:center;margin-top:20px;font-size:13px;color:#6b7fa3}
.msg a{color:#49b6ff;text-decoration:none;font-weight:700}
.err{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.4);border-radius:10px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px;display:none}
.badge-hipaa{display:inline-flex;align-items:center;gap:6px;background:#091c30;border:1px solid rgba(73,182,255,.2);border-radius:999px;padding:4px 12px;font-size:11px;color:#6b9edd;margin-top:16px}
.badge-hipaa::before{content:'🔒';font-size:12px}
.footer-ctr{text-align:center}
.role-hint{background:#081f38;border:1px solid rgba(255,215,0,.15);border-radius:10px;padding:10px 14px;font-size:12px;color:#8b9fc4;margin-bottom:18px}
.role-hint strong{color:#ffd700}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-mark">Hospice<span>Link</span></div>
    <div class="logo-sub">HIPAA-COMPLIANT HOSPICE CRM</div>
  </div>
  <div class="card" id="loginCard">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your CRM account</div>
    <div class="err" id="errMsg">Invalid email or password. Please try again.</div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="emailIn" placeholder="you@agency.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passIn" placeholder="••••••••" autocomplete="current-password">
      <div class="forgot"><a href="forgot-password.html">Forgot password?</a></div>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="msg">Don't have an account? <a href="index.html#pricing">View Plans</a></div>
  </div>
  <div class="footer-ctr">
    <div class="badge-hipaa">HIPAA-Compliant &amp; SOC 2 Ready</div>
    <div style="margin-top:12px;font-size:11px;color:#3a4d6b">
      <a href="privacy.html" style="color:#3a4d6b;text-decoration:none">Privacy Policy</a> &nbsp;·&nbsp;
      <a href="tos.html" style="color:#3a4d6b;text-decoration:none">Terms of Service</a>
    </div>
  </div>
</div>
<script>
const BACKEND = 'https://api.wemarketplus.com';

function doLogin(){
  const email = document.getElementById('emailIn').value.trim();
  const pass = document.getElementById('passIn').value;
  const err = document.getElementById('errMsg');
  err.style.display='none';

  if(!email || !pass){
    err.textContent='Please enter your email and password.';
    err.style.display='block';
    return;
  }

  const btn = document.querySelector('.btn-login');
  btn.textContent='Signing in…';
  btn.disabled=true;

  // Set a timeout — Render cold starts can take 30-60s
  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 45000);
  const warmupId   = setTimeout(() => showWarmingUp('loginCard'), 8000);

  fetch(BACKEND+'/api/auth/login',{
    method:      'POST',
    headers:     {'Content-Type':'application/json'},
    credentials: 'include',
    signal:      controller.signal,
    body:        JSON.stringify({email, password:pass})
  })
  .then(r => {
    clearTimeout(timeoutId); clearTimeout(warmupId); hideWarmingUp('loginCard');
    if (!r.ok && r.status !== 200) {
      return r.json().then(d => { throw { status: r.status, message: d.error || 'Login failed.' }; });
    }
    return r.json();
  })
  .then(data => {
    if (!data.token && data.code !== 'TENANT_SUSPENDED') {
      showError(data.error || data.message || 'Login failed. Check your credentials.');
      btn.textContent = 'Sign In';
      btn.disabled = false;
      return;
    }
    // Suspended account: store limited token and redirect to recovery
    if (data.code === 'TENANT_SUSPENDED' && data.token && data.recovery_url) {
      localStorage.setItem('hl_token', data.token);
      localStorage.setItem('hl_suspended', 'true');
      window.location.href = data.recovery_url;
      return;
    }

    // Handle forced password change (invited users)
    if (data.must_change_password) {
      localStorage.setItem('hl_token', data.token); // FIX #7: localStorage persists across tabs/restarts
      localStorage.setItem('hl_user', JSON.stringify(data.user || { email }));
      window.location.href = 'change-password.html?required=1';
      return;
    }

    // Store real session
    localStorage.setItem('hl_token', data.token); // FIX #7: localStorage persists across tabs/restarts
    localStorage.setItem('hl_user', JSON.stringify(data.user || {}));

    // Redirect based on product + tier
    const product = data.user?.product || 'hospicelink';
    const tier    = data.user?.crm_tier || 'cl_pro';
    let dest;
    if (product === 'communitylink') {
      localStorage.setItem('cl_token', data.token);
      // Route to correct CL CRM based on tier
      if (tier === 'cl_max') dest = 'communitylink-crm-max.html';
      else if (tier === 'cl_gold') dest = 'communitylink-crm-gold.html';
      else dest = 'communitylink-crm-pro.html';
    } else {
      // HospiceLink — redirect to correct HL CRM
      dest = '../' + (tier === 'gold' ? 'crm-gold.html' : tier === 'max' ? 'crm-max.html' : 'crm-pro.html');
    }
    window.location.href = dest;
  })
  .catch(err => {
    clearTimeout(timeoutId); clearTimeout(warmupId); hideWarmingUp('loginCard');
    btn.textContent = 'Sign In';
    btn.disabled = false;

    if (err.name === 'AbortError') {
      showError('Connection timed out. The server may be starting up — please try again in 30 seconds.');
      return;
    }
    if (err.status === 401) { showError('Incorrect email or password.'); return; }
    if (err.status === 403) {
      if (err.code === 'TENANT_SUSPENDED' && err.token && err.recovery_url) {
        // Store limited token so subscription-status.html can call billing portal
        localStorage.setItem('hl_token', err.token);
        localStorage.setItem('hl_suspended', 'true');
        window.location.href = err.recovery_url;
        return;
      }
      showError('Account suspended or cancelled.');
      var errEl = document.getElementById('errMsg');
      if (errEl) {
        errEl.innerHTML = 'Account suspended or cancelled. <a href="subscription-status.html" style="color:#49b6ff;font-weight:700">Manage your subscription</a> to restore access.';
      }
      return;
    }
    if (err.status === 429) { showError('Too many login attempts. Please wait and try again.'); return; }
    if (err.status >= 500)  { showError('Server error. Please try again in a moment.'); return; }

    // Network failure — never fake a login
    showError('Unable to connect. Please check your internet connection and try again.');
  });
}


// FIX #18: Render cold-start reassurance — shown after 8s of waiting
function showWarmingUp(containerId, cancelFn) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var msg = document.createElement('div');
  msg.id  = containerId + '_warming';
  msg.style.cssText = 'margin-top:14px;padding:12px 16px;background:rgba(73,182,255,.08);border:1px solid rgba(73,182,255,.2);border-radius:10px;font-size:13px;color:#8b9fc4;text-align:center;line-height:1.6';
  msg.innerHTML = '<div style="color:#49b6ff;font-weight:700;margin-bottom:4px">⏳ Starting up…</div>' +
    'HospiceLink is spinning up its secure servers. This takes up to 30 seconds on first load.<br>' +
    '<span style="color:#f4f8ff;font-weight:600">Your information is safe — please wait.</span>';
  el.appendChild(msg);
  return msg;
}
function hideWarmingUp(containerId) {
  var el = document.getElementById(containerId + '_warming');
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

function showError(msg){
  const err=document.getElementById('errMsg');
  err.textContent=msg;
  err.style.display='block';
}

// Enter key
document.addEventListener('DOMContentLoaded',()=>{
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter') doLogin();
  });
});
</script>
</body>
</html>
