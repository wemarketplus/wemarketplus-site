<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HospiceLink CRM — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#081426;color:#f4f8ff}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:28px}
.logo-mark{font-size:28px;font-weight:900;color:#49b6ff;letter-spacing:-1px}
.logo-mark span{color:#ffd700}
.logo-sub{font-size:12px;color:#6b7fa3;margin-top:4px;letter-spacing:.05em}
.card{background:#0d1b31;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:32px 28px}
.card-title{font-size:18px;font-weight:800;margin-bottom:6px}
.card-sub{font-size:13px;color:#6b7fa3;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:#8b9fc4;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.field input{width:100%;background:#0a1628;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px 14px;font-size:14px;color:#f4f8ff;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:#49b6ff}
.field input::placeholder{color:#3a4d6b}
.forgot{text-align:right;margin-top:6px}
.forgot a{font-size:12px;color:#49b6ff;text-decoration:none}
.btn-login{width:100%;background:#49b6ff;color:#081426;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s}
.btn-login:hover{opacity:.88}
.divider{text-align:center;font-size:12px;color:#3a4d6b;margin:18px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:rgba(255,255,255,.07)}
.divider::before{left:0}.divider::after{right:0}
.msg{text-align:center;margin-top:20px;font-size:13px;color:#6b7fa3}
.msg a{color:#49b6ff;text-decoration:none;font-weight:700}
.err{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.4);border-radius:10px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px;display:none}
.badge-hipaa{display:inline-flex;align-items:center;gap:6px;background:#091c30;border:1px solid rgba(73,182,255,.2);border-radius:999px;padding:4px 12px;font-size:11px;color:#6b9edd;margin-top:16px}
.badge-hipaa::before{content:'🔒';font-size:12px}
.footer-ctr{text-align:center}
.role-hint{background:#081f38;border:1px solid rgba(255,215,0,.15);border-radius:10px;padding:10px 14px;font-size:12px;color:#8b9fc4;margin-bottom:18px}
.role-hint strong{color:#ffd700}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-mark">Hospice<span>Link</span></div>
    <div class="logo-sub">HIPAA-COMPLIANT HOSPICE CRM</div>
  </div>
  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your CRM account</div>
    <div class="err" id="errMsg">Invalid email or password. Please try again.</div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="emailIn" placeholder="you@agency.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passIn" placeholder="••••••••" autocomplete="current-password">
      <div class="forgot"><a href="forgot-password.html">Forgot password?</a></div>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="msg">Don't have an account? <a href="index.html#pricing">View Plans</a></div>
  </div>
  <div class="footer-ctr">
    <div class="badge-hipaa">HIPAA-Compliant &amp; SOC 2 Ready</div>
    <div style="margin-top:12px;font-size:11px;color:#3a4d6b">
      <a href="privacy.html" style="color:#3a4d6b;text-decoration:none">Privacy Policy</a> &nbsp;·&nbsp;
      <a href="tos.html" style="color:#3a4d6b;text-decoration:none">Terms of Service</a>
    </div>
  </div>
</div>
<script>
const BACKEND = 'https://wemarketplus-backend-1.onrender.com';

function doLogin(){
  const email = document.getElementById('emailIn').value.trim();
  const pass = document.getElementById('passIn').value;
  const err = document.getElementById('errMsg');
  err.style.display='none';

  if(!email || !pass){
    err.textContent='Please enter your email and password.';
    err.style.display='block';
    return;
  }

  const btn = document.querySelector('.btn-login');
  btn.textContent='Signing in…';
  btn.disabled=true;

  fetch(BACKEND+'/api/auth/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body:JSON.stringify({email,password:pass})
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.token || data.user){
      // Store session
      sessionStorage.setItem('hl_token', data.token||'demo');
      sessionStorage.setItem('hl_user', JSON.stringify(data.user||{email,role:'admin'}));
      const plan = (data.user&&data.user.crm_tier)||'pro';
      // Redirect to correct CRM
      const dest = plan==='gold'?'crm-gold.html':plan==='max'?'crm-max.html':'crm-pro.html';
      window.location.href = dest;
    } else {
      // Demo fallback — redirect to plan selector
      showError(data.message||'Login failed. Check your credentials.');
      btn.textContent='Sign In';
      btn.disabled=false;
    }
  })
  .catch(()=>{
    // Backend unreachable — demo mode
    sessionStorage.setItem('hl_token','demo-token');
    sessionStorage.setItem('hl_user',JSON.stringify({email,role:'admin',crm_tier:'pro'}));
    window.location.href='crm-pro.html';
  });
}

function showError(msg){
  const err=document.getElementById('errMsg');
  err.textContent=msg;
  err.style.display='block';
}

// Enter key
document.addEventListener('DOMContentLoaded',()=>{
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter') doLogin();
  });
});
</script>
</body>
</html>
