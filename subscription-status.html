<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HospiceLink — Subscription Status</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#05080f;color:#e8edf5}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.wrap{width:100%;max-width:520px}
.logo{text-align:center;margin-bottom:28px}
.logo-mark{font-size:26px;font-weight:900;color:#4fa3e3;letter-spacing:-1px}
.logo-mark span{color:#4fc87a}
.logo-sub{font-size:11px;color:#6b7fa3;margin-top:4px;letter-spacing:.05em;text-transform:uppercase}
.card{background:#0d1b31;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:32px 28px}
.status-badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 16px;font-size:12px;font-weight:700;margin-bottom:20px}
.badge-active{background:rgba(79,200,122,.12);border:1px solid rgba(79,200,122,.3);color:#4fc87a}
.badge-suspended{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.badge-canceled{background:rgba(100,116,139,.12);border:1px solid rgba(100,116,139,.3);color:#94a3b8}
.badge-past-due{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#f59e0b}
h2{font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.subtitle{font-size:13px;color:#6b7fa3;margin-bottom:24px;line-height:1.6}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;margin-bottom:10px;transition:opacity .12s}
.btn:hover{opacity:.88}
.btn-primary{background:#4fc87a;color:#05080f}
.btn-secondary{background:transparent;border:1px solid rgba(255,255,255,.15);color:#e8edf5}
.btn-danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:#6b7fa3}
.info-val{font-weight:600;color:#e8edf5}
.info-val.green{color:#4fc87a}
.info-val.red{color:#ef4444}
.info-val.yellow{color:#f59e0b}
.info-box{background:rgba(255,255,255,.04);border-radius:10px;padding:14px;margin-bottom:20px}
.divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin:20px 0}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;display:none;margin-bottom:14px}
#loadingState{text-align:center;color:#6b7fa3;padding:40px 0;font-size:14px}
#contentState{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">Hospice<span>Link</span></div>
    <div class="logo-sub">Subscription Status</div>
  </div>
  <div class="card">
    <div class="err" id="errMsg"></div>
    <div id="loadingState">Loading your account status...</div>
    <div id="contentState">
      <div id="statusBadge" class="status-badge badge-active">Active</div>
      <h2 id="statusTitle">Your Subscription</h2>
      <p class="subtitle" id="statusSubtitle">Manage your HospiceLink subscription below.</p>
      <div class="info-box">
        <div class="info-row"><span class="info-label">Plan</span><span class="info-val" id="planName">—</span></div>
        <div class="info-row"><span class="info-label">Status</span><span class="info-val" id="planStatus">—</span></div>
        <div class="info-row" id="periodRow"><span class="info-label">Period Ends</span><span class="info-val" id="periodEnd">—</span></div>
        <div class="info-row" id="deleteRow" style="display:none"><span class="info-label">Data Deleted</span><span class="info-val red" id="deleteDate">—</span></div>
      </div>
      <div id="actionButtons"></div>
    </div>
  </div>
</div>
<script>
const BACKEND = 'https://api.wemarketplus.com';

function getToken() {
  return localStorage.getItem('hl_token') || sessionStorage.getItem('hl_token') || '';
}

function showErr(msg) {
  var e = document.getElementById('errMsg');
  e.textContent = msg;
  e.style.display = 'block';
}

function renderStatus(data) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('contentState').style.display = 'block';

  var badge   = document.getElementById('statusBadge');
  var title   = document.getElementById('statusTitle');
  var subtitle = document.getElementById('statusSubtitle');
  var buttons = document.getElementById('actionButtons');
  var status  = data.subscription_status || 'unknown';
  var plan    = (data.crm_tier || 'pro');
  var planLabel = plan.charAt(0).toUpperCase() + plan.slice(1);

  document.getElementById('planName').textContent = 'HospiceLink ' + planLabel;
  document.getElementById('planStatus').textContent = status.charAt(0).toUpperCase() + status.slice(1);

  if (data.current_period_end) {
    document.getElementById('periodEnd').textContent = new Date(data.current_period_end).toLocaleDateString();
  } else {
    document.getElementById('periodRow').style.display = 'none';
  }
  if (data.scheduled_delete_at) {
    document.getElementById('deleteRow').style.display = 'flex';
    document.getElementById('deleteDate').textContent = new Date(data.scheduled_delete_at).toLocaleDateString();
  }

  if (status === 'active') {
    badge.className = 'status-badge badge-active';
    badge.textContent = 'Active';
    title.textContent = 'Your Subscription is Active';
    subtitle.textContent = 'Your CRM is fully operational.';
    buttons.innerHTML =
      '<a href="login.html" class="btn btn-primary">Go to My CRM</a>' +
      '<button class="btn btn-secondary" onclick="openPortal()">Manage Billing</button>';
  } else if (status === 'past_due') {
    badge.className = 'status-badge badge-past-due';
    badge.textContent = 'Payment Past Due';
    title.textContent = 'Payment Required';
    subtitle.textContent = 'Your payment failed. Please update your payment method to keep your account active.';
    buttons.innerHTML =
      '<button class="btn btn-primary" onclick="openPortal()">Update Payment Method</button>' +
      '<a href="login.html" class="btn btn-secondary">Continue to CRM</a>';
  } else if (status === 'suspended') {
    badge.className = 'status-badge badge-suspended';
    badge.textContent = 'Suspended';
    title.textContent = 'Account Suspended';
    subtitle.textContent = 'Your account has been suspended due to a billing issue. Update your payment method to restore access immediately.';
    buttons.innerHTML =
      '<button class="btn btn-primary" onclick="openPortal()">Restore Access Now</button>' +
      '<a href="mailto:support@wemarketplus.com" class="btn btn-secondary">Contact Support</a>';
  } else if (status === 'canceled') {
    badge.className = 'status-badge badge-canceled';
    badge.textContent = 'Cancelled';
    title.textContent = 'Subscription Ended';
    subtitle.textContent = 'Your subscription has ended. Reactivate to regain access to your CRM and all your data.';
    buttons.innerHTML =
      '<a href="index.html#pricing" class="btn btn-primary">Reactivate My Account</a>' +
      '<a href="mailto:support@wemarketplus.com" class="btn btn-secondary">Contact Support</a>';
  } else {
    badge.className = 'status-badge badge-canceled';
    badge.textContent = status;
    title.textContent = 'Account Status';
    subtitle.textContent = 'Contact support if you need help with your account.';
    buttons.innerHTML = '<a href="mailto:support@wemarketplus.com" class="btn btn-primary">Contact Support</a>';
  }
}

function openPortal() {
  var tok = getToken();
  if (!tok) { showErr('Please log in first to manage billing.'); return; }
  fetch(BACKEND + '/api/billing/portal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.url) { window.location.href = d.url; }
    else { showErr(d.error || 'Failed to open billing portal. Contact support@wemarketplus.com'); }
  })
  .catch(function() { showErr('Connection error. Please try again.'); });
}

function loadStatus() {
  var tok = getToken();
  if (!tok) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('contentState').style.display = 'block';
    document.getElementById('statusBadge').className = 'status-badge badge-canceled';
    document.getElementById('statusBadge').textContent = 'Not Logged In';
    document.getElementById('statusTitle').textContent = 'Sign In to View Status';
    document.getElementById('statusSubtitle').textContent = 'Please log in to view your subscription status.';
    document.getElementById('actionButtons').innerHTML =
      '<a href="login.html" class="btn btn-primary">Log In</a>' +
      '<a href="index.html#pricing" class="btn btn-secondary">View Plans</a>';
    return;
  }

  fetch(BACKEND + '/api/subscription-status', {
    headers: { 'Authorization': 'Bearer ' + tok },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) {
      if (d.error.includes('not found')) {
        showErr('Account not found. Contact support@wemarketplus.com');
      } else {
        // Try billing subscription endpoint as fallback
        return fetch(BACKEND + '/api/billing/subscription', {
          headers: { 'Authorization': 'Bearer ' + tok },
          credentials: 'include',
        }).then(function(r2) { return r2.json(); }).then(renderStatus);
      }
    } else {
      renderStatus(d);
    }
  })
  .catch(function() {
    document.getElementById('loadingState').textContent = 'Unable to load status. Check your connection.';
  });
}

document.addEventListener('DOMContentLoaded', loadStatus);
</script>
</body>
</html>
